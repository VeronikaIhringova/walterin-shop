<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product cards — interactive</title>
<link rel="stylesheet" href="cards.css">
<style>
  body{margin:0;background:var(--paper)}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 22px 60px}
  .sec{font:400 11px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin:34px 0 14px}
  .sec:first-child{margin-top:0}
  .rule{border:0;border-top:var(--line) solid var(--ink);margin:40px 0}
  .pp__cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
  @media (max-width:820px){.pp__cols{grid-template-columns:minmax(0,1fr)}}
  .gal{border:var(--line) solid var(--ink);border-radius:var(--radius);overflow:hidden;aspect-ratio:4/5;background:var(--paper)}
  .gal img{width:100%;height:100%;object-fit:cover;display:block}
  .hint{font-size:13px;opacity:.7;margin:0 0 16px}
</style></head><body>
<div class="wrap" id="root">
  <p class="sec">Cards — hover one, or tab to it</p>
  <p class="hint" id="hint"></p>
  <div class="grid" id="cards"></div>

  <hr class="rule">

  <p class="sec">The product page a dated card opens</p>
  <div class="pp__cols pp" id="pp">
    <div class="gal"><img id="hero" alt=""></div>
    <div>
      <h1 class="pp__title" id="ptitle"></h1>
      <p class="pp__price" id="pprice"></p>

      <p class="opt__name" id="lFmt"></p>
      <div class="opt__row">
        <label class="opt"><input type="radio" name="fmt" value="digital" checked><span class="opt__dot"></span><span class="opt__txt" id="oDig"></span></label>
        <label class="opt"><input type="radio" name="fmt" value="printed"><span class="opt__dot"></span><span class="opt__txt" id="oPr"></span></label>
      </div>

      <!-- the launch label sits directly above the email field: it is the reason to sign up -->
      <p class="pp__label" id="plabel"></p>
      <form class="notify" onsubmit="return false">
        <div class="notify__row">
          <input class="notify__input" id="email" type="email">
          <button class="btn" id="bnotify" type="submit"></button>
        </div>
        <p class="note" id="note"></p>
      </form>
    </div>
  </div>
</div>
<script src="cards.js"></script>
<script>
const P=new URLSearchParams(location.search);
const V=+(P.get('v')||1), LANG=P.get('lang')||'en';
document.documentElement.lang=LANG;
const T=COPY[LANG];
document.getElementById('pp').classList.add('v'+V);
document.getElementById('hint').textContent = LANG==='en'
  ? 'On a mouse the bar appears on hover; keyboard focus shows exactly the same thing. On a touch screen it is visible from the start, so the date is never hidden.'
  : 'Na myši sa pruh zobrazí pri prejdení kurzorom; klávesové zameranie ukáže to isté. Na dotykovom displeji je viditeľný hneď, aby dátum nikdy nechýbal.';
document.getElementById('cards').innerHTML = STATES.map(s=>card(V,s,LANG)).join('');
document.getElementById('hero').src=IMG.prague;
['ptitle','lFmt','oDig','oPr','bnotify','note'].forEach(()=>{});
ptitle.textContent=T.tPrague; lFmt.textContent=T.fmt;
oDig.textContent=T.digital; oPr.textContent=T.printed;
bnotify.textContent=T.notify; note.textContent=T.note;
email.placeholder=T.email; email.setAttribute('aria-label',T.email);
function render(){
  const f=document.querySelector('input[name=fmt]:checked').value;
  pprice.textContent = f==='digital' ? '€18,99' : '€27,99';
  plabel.textContent = T.availableFrom+' '+(f==='digital'?T.oct:T.nov);
}
document.querySelectorAll('input[name=fmt]').forEach(r=>r.addEventListener('change',render));
render();
</script>
</body></html>
