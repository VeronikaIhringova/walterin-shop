<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buy column · mock-ups</title>
<!--
  Walterin buy column: design directions, every state, EN + SK. Static mock-up, not theme code.
  URL params: dir=B|C|A · product=tarot|book · state=… · lang=en|sk · extra=sticky|zoom · board=0 (hide the review bar)
  Tarot states: coming_soon · available · low_stock · sold_out_one · sold_out_all
  Book states:  printed · ebook · unavailable
  Book prices, languages and the missing SK eBook are SAMPLE data (real prices are TBD).
  Dashed accordions = suggestions for Veronka to choose from, not approved copy.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'WalterinBold'; src: url('https://cdn.shopify.com/s/files/1/0897/8864/5705/files/WalterinBold.woff2?v=1725196093') format('woff2'), url('../../../assets/WalterinBold.woff2') format('woff2'); font-display: block; }

:root {
  --paper: #FFFDF7; --ink: #222222; --yellow: #FCF205; --sky: #6FE9FA; --red: #F60403; --green: #9FDA29;
  --line: 2.5px; --radius: 8px; --sh: 4px; --shadow: var(--sh) var(--sh) 0 var(--ink); --shadow-hover: 2px 2px 0 var(--ink);
  --display: 'WalterinBold', 'Chalkboard SE', 'Comic Sans MS', sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  /* Ground-truth type scale only (mobile here, desktop below) */
  --fs-heading: 32px; --fs-label: 20px; --fs-price: 28px; --fs-body: 16px; --fs-small: 14px;
  --group: 32px; --frame-pad: 15px;
  /* Panel sizing: the generous unit */
  --panel-pad: 20px; --panel-gap: 24px; --choice-h: 56px; --btn-h: 56px; --pay-h: 48px;
  --faded: 0.4;
  --ease: cubic-bezier(0.2, 0.75, 0.2, 1);
}
@media (min-width: 750px) {
  :root { --fs-heading: 40px; --fs-label: 22px; --fs-price: 32px; --fs-body: 17px; --group: 40px; --frame-pad: 50px;
          --panel-pad: 32px; --panel-gap: 32px; --choice-h: 64px; --btn-h: 60px; --pay-h: 52px; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: var(--fs-body); line-height: 1.55; -webkit-font-smoothing: antialiased; }
p, ul, fieldset, legend, h1, h2, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }
img { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.sr { position: absolute !important; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Review bar (not part of the design) ---------- */
.board { font: 13px/1.4 var(--body); background: #fff; border-bottom: 1px dashed #999; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.board b { font-weight: 700; }
.board a { color: inherit; padding: 2px 6px; border: 1px solid #bbb; border-radius: 4px; text-decoration: none; }
.board a[aria-current='true'] { background: var(--yellow); border-color: var(--ink); }
.board .grp { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
body.noboard .board { display: none; }

/* ---------- Fake site header (edges = the real header) ---------- */
.wrap { width: 92%; max-width: 1400px; margin-inline: auto; padding-inline: var(--frame-pad); }
.site { display: flex; align-items: center; justify-content: space-between; height: 72px; }
.site__logo { font-family: var(--display); font-size: 34px; }
.site__nav { display: flex; gap: 40px; font-weight: 700; font-size: 17px; text-transform: uppercase; }
.site__icons { display: flex; gap: 20px; font-size: 14px; }
@media (max-width: 749px) { .site { height: 56px; } .site__nav { display: none; } .site__logo { font-size: 28px; } }

/* ---------- Page grid ---------- */
.pdp { padding-block: 24px 64px; }
@media (min-width: 990px) { .pdp { padding-block: 48px 96px; } }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 990px) { .grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 48px; align-items: start; } }

/* Gallery */
.gal__main { position: relative; aspect-ratio: 1; border: var(--line) solid var(--ink); border-radius: var(--radius); overflow: hidden; background: var(--paper); }
.gal__main img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.gal__count { position: absolute; right: 12px; bottom: 12px; padding: 4px 8px; font-size: 14px; line-height: 1.2; font-variant-numeric: tabular-nums; background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--radius); }
.gal__thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 12px; margin-top: 12px; padding: 0 var(--sh) var(--sh) 0; }
.gal__thumbs span { aspect-ratio: 1; border: var(--line) solid var(--ink); border-radius: var(--radius); overflow: hidden; }
.gal__thumbs span:first-child { box-shadow: var(--shadow); outline: 3px solid var(--yellow); outline-offset: -5.5px; }
.gal__thumbs img { width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 749px) { .gal__thumbs { display: none; } }

/* ================================================================
   Shared buy-column system
   Three text levels: headline (title) · subheadline (labels) · body/small. Price is its own role.
   Every hard shadow reserves --sh on the right and bottom so its outer edge meets the column edge.
   ================================================================ */
.col { display: flex; flex-direction: column; gap: var(--group); min-width: 0; }
.trim { text-box: trim-both cap alphabetic; } /* optical measurement: from the letters, not the line box */
.title { font-family: var(--display); font-weight: 400; font-size: var(--fs-heading); line-height: 1.05; letter-spacing: 0.01em; text-transform: uppercase; text-wrap: pretty; }
.label { font-family: var(--display); font-weight: 400; font-size: var(--fs-label); line-height: 1.1; letter-spacing: 0.04em; text-transform: uppercase; }
.small { font-size: var(--fs-small); line-height: 1.45; }
.body { font-size: var(--fs-body); line-height: 1.45; }
.price { font-weight: 700; font-size: var(--fs-price); line-height: 1; font-variant-numeric: tabular-nums; }
.link { color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.link:hover { text-decoration-color: var(--yellow); text-decoration-thickness: 4px; }
.ship { display: inline-flex; align-items: center; gap: 8px; }
.ship svg { flex: none; width: 22px; height: 22px; }

.head { display: flex; flex-direction: column; }
.head .title + .pricebox { margin-top: 24px; }
.pricebox { display: flex; flex-direction: column; gap: 8px; }
.head--row .pricebox { flex-direction: row; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }

.opt { border: 0; min-width: 0; display: flex; flex-direction: column; }
.opt + .opt { margin-top: 24px; }
.opt legend { float: left; width: 100%; margin-bottom: 16px; }
.opt__note { margin-top: 12px; }

/* The one button */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--btn-h); padding: 12px 28px; margin: 0;
  font-family: var(--display); font-size: var(--fs-label); line-height: 1; letter-spacing: 0.03em; text-transform: uppercase;
  color: var(--ink); background: var(--yellow); border: var(--line) solid var(--ink); border-radius: var(--radius);
  box-shadow: var(--shadow); cursor: pointer; -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent;
  transition: transform .12s var(--ease), box-shadow .12s var(--ease);
}
.btn:hover { transform: translate(2px, 2px); box-shadow: var(--shadow-hover); }
.btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
/* Sold out: faded, never struck through */
.btn:disabled { background: var(--paper); box-shadow: none; transform: none; cursor: not-allowed; }
.btn:disabled > * , .btn:disabled { color: rgb(34 34 34 / var(--faded)); border-color: rgb(34 34 34 / var(--faded)); }
.btn .num { font-family: var(--body); font-weight: 700; font-size: var(--fs-body); letter-spacing: 0; text-transform: none; }
.reserve { margin-right: var(--sh); margin-bottom: var(--sh); }
.btn--block { width: calc(100% - var(--sh)); }

.cta { display: flex; flex-direction: column; }
.cta > * + * { margin-top: 12px; }
/* Express checkout: Shopify renders the wallets the device supports; the mock-up shows both */
.express { margin-inline: var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.wallet { height: var(--pay-h); border-radius: var(--radius); background: #000; color: #fff; display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 19px/1 -apple-system, 'SF Pro Text', system-ui, sans-serif; box-shadow: 0 0 0 var(--line) var(--ink); }
.wallet svg { height: 20px; width: auto; }
.wallet b { font-weight: 500; }
.pay { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
.pay span { height: 24px; min-width: 38px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--ink); border-radius: 4px; font: 700 10px/1 var(--body); letter-spacing: .02em; background: var(--paper); }

/* Notify */
.notify { display: flex; flex-direction: column; }
.notify__row { display: flex; gap: 12px; }
.input { flex: 1; min-width: 0; min-height: var(--btn-h); padding: 0 16px; font-size: var(--fs-body); background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--radius); outline: none; }
.input::placeholder { color: var(--ink); opacity: .55; }
.input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.notify .btn { flex: none; }
.check { display: flex; align-items: flex-start; gap: 8px; margin-top: 16px; cursor: pointer; }
.check input { flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--ink); }
.notify__note { margin-top: 8px; }
@media (max-width: 479px) { .notify__row { flex-direction: column; } .notify .btn { width: calc(100% - var(--sh)); } }

.status { padding: 12px 16px; border: var(--line) solid var(--ink); border-radius: var(--radius); font-size: var(--fs-small); background: var(--sky); }

/* Accordions */
.accs { display: grid; gap: 12px; }
.acc { border: var(--line) solid var(--ink); border-radius: var(--radius); background: var(--paper); }
.acc--suggest { border-style: dashed; }
.acc > summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; list-style: none; cursor: pointer; border-radius: calc(var(--radius) - 2px); }
.acc > summary::-webkit-details-marker { display: none; }
.acc > summary:hover .acc__icon { background: var(--yellow); }
.acc__title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { font: 700 11px/1 var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 4px 6px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--sky); }
.acc__icon { position: relative; flex: none; width: 28px; height: 28px; border: var(--line) solid var(--ink); border-radius: 50%; background: var(--paper); transition: transform .2s var(--ease), background-color .2s; }
.acc__icon::before, .acc__icon::after { content: ''; position: absolute; left: 50%; top: 50%; width: 12px; height: 2.5px; background: var(--ink); transform: translate(-50%, -50%); }
.acc__icon::after { transform: translate(-50%, -50%) rotate(90deg); }
.acc[open] .acc__icon { transform: rotate(45deg); background: var(--yellow); }
.acc__body { padding: 0 16px 16px; font-size: var(--fs-small); line-height: 1.55; display: grid; gap: 12px; }
.acc__body .lead { font-size: var(--fs-body); line-height: 1.5; }
.list { display: grid; gap: 8px; }
.list li { position: relative; padding-left: 16px; }
.list li::before { content: ''; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; background: var(--ink); border-radius: 1px; }
.gpsr { font-size: 13px; line-height: 1.45; margin-top: 4px; }

/* ---------- Direction A: tiles ---------- */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); padding: 0 var(--sh) var(--sh) 0; }
.tile { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 16px; background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow); cursor: pointer; transition: box-shadow .12s var(--ease), background-color .12s; }
.tile:hover { box-shadow: var(--shadow-hover); }
.tile:has(input:checked) { background: var(--yellow); box-shadow: var(--shadow); }
.tile:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: 3px; }
.tile input, .seg__opt input, .cell--opt input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: inherit; }
.tile__dot { flex: none; width: 16px; height: 16px; border: var(--line) solid var(--ink); border-radius: 50%; background: var(--paper); }
.tile:has(input:checked) .tile__dot { background: radial-gradient(circle, var(--ink) 0 3px, var(--paper) 3.5px); }
.tile__text { display: flex; flex-direction: column; min-width: 0; }
.tile__name { font-family: var(--display); font-size: var(--fs-label); line-height: 1.1; letter-spacing: 0.02em; text-transform: uppercase; overflow-wrap: anywhere; }
.tile__note { font-size: var(--fs-small); line-height: 1.3; font-variant-numeric: tabular-nums; }
.tile__price { margin-left: auto; font-weight: 700; font-size: var(--fs-small); font-variant-numeric: tabular-nums; }
.tile:has(input:disabled) { cursor: not-allowed; box-shadow: none; }
.tile:has(input:disabled) > * { opacity: var(--faded); }
@media (max-width: 479px) { .tiles[data-n='3'], .tiles[data-priced] { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Direction B: the panel + segmented switch ---------- */
.dirB .panel { border: var(--line) solid var(--ink); border-radius: var(--radius); background: var(--paper); box-shadow: var(--shadow); padding: var(--panel-pad); display: flex; flex-direction: column; gap: var(--panel-gap); margin: 0 var(--sh) var(--sh) 0; }
.seg { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); border: var(--line) solid var(--ink); border-radius: var(--radius); overflow: hidden; }
.seg__opt { position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; min-height: var(--choice-h); padding: 8px; text-align: center; cursor: pointer; background: var(--paper); transition: background-color .12s; }
.seg__opt + .seg__opt { border-left: var(--line) solid var(--ink); }
.seg__opt:hover { background: color-mix(in srgb, var(--yellow) 35%, var(--paper)); }
.seg__opt:has(input:checked) { background: var(--yellow); }
.seg__opt:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: -7px; }
.seg__opt:has(input:disabled) { cursor: not-allowed; background: var(--paper); }
.seg__opt:has(input:disabled) > span { opacity: var(--faded); }
@media (max-width: 479px) {
  .seg[data-n='3'] .tile__name { font-size: 17px; }
  .seg[data-priced] .tile__name { font-size: 18px; }
}

/* ---------- Direction C: the column drawn like a card (frames in a grid) ---------- */
.card { border: var(--line) solid var(--ink); border-radius: var(--radius); background: var(--paper); box-shadow: var(--shadow); margin: 0 var(--sh) var(--sh) 0; overflow: hidden; }
.card__row { display: grid; border: 0; min-width: 0; }
.card__row + .card__row { border-top: var(--line) solid var(--ink); }
.cell { padding: calc(var(--panel-pad) * .75) var(--panel-pad); min-width: 0; }
.cell + .cell { border-left: var(--line) solid var(--ink); }
.card__head { background: var(--sky); padding-block: var(--panel-pad); }
.card__meta { grid-template-columns: auto minmax(0, 1fr); align-items: stretch; }
.card__meta .cell:only-child { grid-column: 1 / -1; }
.card__meta .cell { display: flex; align-items: center; }
.card__cap { float: left; width: 100%; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; padding: 12px var(--panel-pad); border-bottom: var(--line) solid var(--ink); }
.card__opts { clear: both; display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); }
.cell--opt { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: calc(var(--choice-h) + 8px); padding: 12px var(--panel-pad); cursor: pointer; background: var(--paper); transition: background-color .12s; }
.cell--opt + .cell--opt { border-left: var(--line) solid var(--ink); }
.cell--opt:hover { background: color-mix(in srgb, var(--yellow) 35%, var(--paper)); }
.cell--opt:has(input:checked) { background: var(--yellow); }
.cell--opt:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: -7px; }
.cell--opt:has(input:disabled) { cursor: not-allowed; background: var(--paper); }
.cell--opt:has(input:disabled) > span { opacity: var(--faded); }
.card__cta { padding: var(--panel-pad); }
@media (max-width: 479px) {
  .card__opts[data-n='3'] { grid-template-columns: minmax(0, 1fr); }
  .card__opts[data-n='3'] .cell--opt + .cell--opt { border-left: 0; border-top: var(--line) solid var(--ink); }
  .card__opts[data-priced] .cell--opt { padding-inline: 14px; }
  .card__opts[data-priced] .tile__name { font-size: 18px; }
  .card__meta { grid-template-columns: minmax(0, 1fr); }
  .card__meta .cell + .cell { border-left: 0; border-top: var(--line) solid var(--ink); }
}

/* ---------- Mobile sticky bar ---------- */
.sticky { display: none; }
@media (max-width: 749px) {
  body.show-sticky .sticky { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px calc(4vw + 15px) calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border-top: var(--line) solid var(--ink); }
  .sticky__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .sticky__text .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 18px; }
  .sticky .btn { min-height: 44px; padding: 8px 16px; box-shadow: 3px 3px 0 var(--ink); margin-right: 3px; }
}

/* ---------- Zoom (PhotoSwipe look, rendered statically for review) ---------- */
.zoom { position: fixed; inset: 0; z-index: 10; background: var(--paper); display: none; flex-direction: column; }
body.show-zoom .zoom { display: flex; }
.zoom__bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); border-bottom: var(--line) solid var(--ink); }
.zoom__stage { flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.zoom__stage img { width: 170%; max-width: none; transform: translate(12%, 6%); }
.zoom__hint { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: var(--line) solid var(--ink); text-align: center; }
.zoom .btn { min-height: 44px; padding: 8px 14px; box-shadow: 3px 3px 0 var(--ink); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="board" id="board"></div>

<header class="wrap site" aria-hidden="true">
  <span class="site__nav"><span>Walterin</span><span>Shop</span><span>About</span></span>
  <span class="site__logo">Walterin</span>
  <span class="site__icons"><span>⌕</span><span>◯</span><span>▢</span></span>
</header>

<main class="pdp">
  <div class="wrap grid" id="pdp">
    <div class="gal" id="gal"></div>
    <div id="col"></div>
  </div>
</main>

<div class="sticky" id="sticky"></div>
<div class="zoom" id="zoom"></div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var S = { dir: q.get('dir') || 'B', product: q.get('product') || 'tarot', state: q.get('state') || '', lang: q.get('lang') || 'en', extra: q.get('extra') || '' };
  if (!S.state) S.state = S.product === 'book' ? 'printed' : 'coming_soon';
  if (q.get('board') === '0') document.body.classList.add('noboard');
  if (S.extra === 'sticky') document.body.classList.add('show-sticky');
  if (S.extra === 'zoom') document.body.classList.add('show-zoom');
  document.documentElement.lang = S.lang;

  var CDN = 'https://cdn.shopify.com/s/files/1/0897/8864/5705/files/';
  var IMG = {
    tarot: ['https://walterin.com/cdn/shop/files/PRODUCT_BOOK1_f3f0dc79-452c-4817-ad72-522a357d20fa.jpg?width=1600',
            'https://walterin.com/cdn/shop/files/Generated_Image_April_09_2026_-_12_55PM.jpg?width=1600'],
    book: [CDN + 'walterin-prague-illustrated-comic-guide-book-cover.jpg?width=1600',
           CDN + 'walterin-prague-witty-illustrated-comic-guide-book-outdoor.jpg?width=1600',
           CDN + 'walterin-prague-illustrated-comic-guide-book-in-hands.jpg?width=1600']
  };
  var ICON_SHIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 12.5 12 17l9-4.5"/><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="M3 7.5v9L12 21l9-4.5v-9"/><path d="M12 12v9"/></svg>';
