<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buy column · mock-ups</title>
<!--
  Walterin buy column: five directions, same content and approved copy. Static mock-up, not theme code.
  URL params: dir=B|L|F|E|S · product=tarot|book · state=… · lang=en|sk · extra=sticky|zoom · board=0
    B Panel · L Light panel · F Frameless · E Editorial · S Strip
  Tarot states: coming_soon · available · low_stock · sold_out_one · sold_out_all
  Book states:  printed · ebook · unavailable
  Book prices, languages and the missing SK eBook are SAMPLE data (real prices are TBD).
  Dashed accordions tagged "Suggestion" = drafts for Veronka to choose from.
  UI palette: ink, paper, yellow only. Sky / red / green live only inside the artwork.
  Text never breaks inside a word: overflow-wrap normal, hyphens none, word-break normal;
  hyphenated words are kept whole (.nb); choice columns are at least as wide as their longest word.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'WalterinBold'; src: url('https://cdn.shopify.com/s/files/1/0897/8864/5705/files/WalterinBold.woff2?v=1725196093') format('woff2'), url('../../../assets/WalterinBold.woff2') format('woff2'); font-display: block; }

:root {
  --paper: #FFFDF7; --ink: #222222; --yellow: #FCF205;
  --line: 2.5px; --thin: 1.5px; --hair: 1px; --radius: 8px; --sh: 4px;
  --shadow: var(--sh) var(--sh) 0 var(--ink); --shadow-hover: 2px 2px 0 var(--ink);
  --display: 'WalterinBold', 'Chalkboard SE', 'Comic Sans MS', sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  /* Ground-truth type scale only (mobile, desktop below) */
  --fs-heading: 32px; --fs-label: 20px; --fs-price: 28px; --fs-body: 16px; --fs-small: 14px;
  --group: 32px; --frame-pad: 15px;
  --pad: 20px; --gap: 24px; --choice-h: 56px; --btn-h: 56px; --pay-h: 48px;
  --faded: 0.4;
  --ease: cubic-bezier(0.2, 0.75, 0.2, 1);
}
@media (min-width: 750px) {
  :root { --fs-heading: 40px; --fs-label: 22px; --fs-price: 32px; --fs-body: 17px; --group: 40px; --frame-pad: 50px;
          --pad: 32px; --gap: 32px; --choice-h: 64px; --btn-h: 60px; --pay-h: 52px; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: var(--fs-body); line-height: 1.55; -webkit-font-smoothing: antialiased;
       overflow-wrap: normal; word-break: normal; hyphens: none; -webkit-hyphens: none; }
.nb { white-space: nowrap; }
p, ul, fieldset, legend, h1, h2, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }
img { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.sr { position: absolute !important; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Review bar (not part of the design) ---------- */
.board { font: 13px/1.4 var(--body); background: #fff; border-bottom: 1px dashed #999; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.board b { font-weight: 700; }
.board a { color: inherit; padding: 2px 6px; border: 1px solid #bbb; border-radius: 4px; text-decoration: none; }
.board a[aria-current='true'] { background: var(--yellow); border-color: var(--ink); }
.board .grp { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
body.noboard .board { display: none; }

/* ---------- Fake site header (edges = the real header) ---------- */
.wrap { width: 92%; max-width: 1400px; margin-inline: auto; padding-inline: var(--frame-pad); }
.site { display: flex; align-items: center; justify-content: space-between; height: 72px; }
.site__logo { font-family: var(--display); font-size: 34px; }
.site__nav { display: flex; gap: 40px; font-weight: 700; font-size: 17px; text-transform: uppercase; }
.site__icons { display: flex; gap: 20px; font-size: 14px; }
@media (max-width: 749px) { .site { height: 56px; } .site__nav { display: none; } .site__logo { font-size: 28px; } }

/* ---------- Page grid + gallery ---------- */
.pdp { padding-block: 24px 64px; }
@media (min-width: 990px) { .pdp { padding-block: 48px 96px; } }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 990px) { .grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 48px; align-items: start; } }
.gal__main { position: relative; aspect-ratio: 1; border: var(--line) solid var(--ink); border-radius: var(--radius); overflow: hidden; background: var(--paper); }
.gal__main img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.gal__count { position: absolute; right: 12px; bottom: 12px; padding: 4px 8px; font-size: 14px; line-height: 1.2; font-variant-numeric: tabular-nums; background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--radius); }
.gal__thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 12px; margin-top: 12px; padding: 0 var(--sh) var(--sh) 0; }
.gal__thumbs span { aspect-ratio: 1; border: var(--line) solid var(--ink); border-radius: var(--radius); overflow: hidden; }
.gal__thumbs span:first-child { box-shadow: var(--shadow); outline: 3px solid var(--yellow); outline-offset: -5.5px; }
.gal__thumbs img { width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 749px) { .gal__thumbs { display: none; } }

/* ================================================================
   Shared system: three text levels (headline · label · body/small), price is its own role.
   Hard shadows reserve --sh right + bottom, so their outer edge meets the column edge.
   ================================================================ */
.col { display: flex; flex-direction: column; gap: var(--group); min-width: 0; }
.trim { text-box: trim-both cap alphabetic; }
.title { font-family: var(--display); font-weight: 400; font-size: var(--fs-heading); line-height: 1.05; letter-spacing: 0.01em; text-transform: uppercase; text-wrap: pretty; }
.label { font-family: var(--display); font-weight: 400; font-size: var(--fs-label); line-height: 1.1; letter-spacing: 0.04em; text-transform: uppercase; }
.small { font-size: var(--fs-small); line-height: 1.45; }
.body { font-size: var(--fs-body); line-height: 1.45; }
.price { font-weight: 700; font-size: var(--fs-price); line-height: 1; font-variant-numeric: tabular-nums; }
.link { color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.link:hover { text-decoration-color: var(--yellow); text-decoration-thickness: 4px; }
.ship { display: inline-flex; align-items: center; gap: 8px; }
.ship svg { flex: none; width: 22px; height: 22px; }

.head { display: flex; flex-direction: column; }
.head .title + .pricebox { margin-top: 24px; }
.pricebox { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }

.opt { border: 0; min-width: 0; display: flex; flex-direction: column; }
.opt + .opt { margin-top: 24px; }
.opt legend { float: left; width: 100%; margin-bottom: 16px; }
.opt__note { margin-top: 12px; }

/* Choice names: WalterinBold label; a long group (a word ≥ 11 letters) steps down to Body size */
.cname { font-family: var(--display); font-size: var(--fs-label); line-height: 1.1; letter-spacing: 0.02em; text-transform: uppercase; }
.long .cname, .choices[data-n='3'] .cname { font-size: var(--fs-body); letter-spacing: 0.03em; }
.cnote { font-size: var(--fs-small); line-height: 1.3; font-variant-numeric: tabular-nums; }
.choice input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: inherit; }
.choice { position: relative; cursor: pointer; min-width: min-content; }
.choice:has(input:disabled) { cursor: not-allowed; }
.choice:has(input:disabled) > span { opacity: var(--faded); }
/* Side by side only when every label fits whole; otherwise stack. Decided by the space the group
   actually has (container query), not by the screen, so it holds in panels, strips and label columns. */
.cq { container-type: inline-size; min-width: 0; }
.choices { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); }
@container (max-width: 319px) { .choices[data-n='2'] { grid-template-columns: minmax(0, 1fr); } }
@container (max-width: 439px) { .choices[data-priced] { grid-template-columns: minmax(0, 1fr); } }
@container (max-width: 439px) { .choices[data-n='3'] { grid-template-columns: minmax(0, 1fr); } }

/* The one button */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--btn-h); padding: 12px 28px; margin: 0;
  font-family: var(--display); font-size: var(--fs-label); line-height: 1; letter-spacing: 0.03em; text-transform: uppercase;
  color: var(--ink); background: var(--yellow); border: var(--line) solid var(--ink); border-radius: var(--radius);
  box-shadow: var(--shadow); cursor: pointer; -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent;
  transition: transform .12s var(--ease), box-shadow .12s var(--ease); white-space: nowrap; }
.btn:hover { transform: translate(2px, 2px); box-shadow: var(--shadow-hover); }
.btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
.btn:disabled { background: var(--paper); box-shadow: none; transform: none; cursor: not-allowed; color: rgb(34 34 34 / var(--faded)); border-color: rgb(34 34 34 / var(--faded)); }
.btn .num { font-family: var(--body); font-weight: 700; font-size: var(--fs-body); letter-spacing: 0; text-transform: none; }
.reserve { margin-right: var(--sh); margin-bottom: var(--sh); }
.btn--block { width: calc(100% - var(--sh)); }

.cta { display: flex; flex-direction: column; }
.cta > * + * { margin-top: 12px; }
.express { margin-inline: var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.wallet { height: var(--pay-h); border-radius: var(--radius); background: #000; color: #fff; display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 19px/1 -apple-system, 'SF Pro Text', system-ui, sans-serif; box-shadow: 0 0 0 var(--line) var(--ink); white-space: nowrap; }
.wallet svg { height: 20px; width: auto; }
.pay { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
.pay span { height: 24px; min-width: 38px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--ink); border-radius: 4px; font: 700 10px/1 var(--body); letter-spacing: .02em; background: var(--paper); }

.notify { display: flex; flex-direction: column; }
.notify__row { display: flex; gap: 12px; }
.input { flex: 1; min-width: 0; min-height: var(--btn-h); padding: 0 16px; font-size: var(--fs-body); background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--radius); outline: none; }
.input::placeholder { color: var(--ink); opacity: .55; }
.input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.notify .btn { flex: none; }
.check { display: flex; align-items: flex-start; gap: 8px; margin-top: 16px; cursor: pointer; }
.check input { flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--ink); }
.notify__note { margin-top: 8px; }
@media (max-width: 479px) { .notify__row { flex-direction: column; } .notify .btn { width: calc(100% - var(--sh)); } }

/* Status (no colour): ink frame + ink icon */
.status { display: flex; gap: 8px; align-items: flex-start; padding: 12px 16px; border: var(--line) solid var(--ink); border-radius: var(--radius); font-size: var(--fs-small); background: var(--paper); }
.status::before { content: 'i'; flex: none; width: 20px; height: 20px; border: 2px solid var(--ink); border-radius: 50%; font: 700 12px/16px var(--body); text-align: center; }

/* ---------- Accordions (three weights; same structure) ---------- */
.accs { display: grid; gap: 12px; }
.acc { border: var(--line) solid var(--ink); border-radius: var(--radius); background: var(--paper); }
.acc > summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; list-style: none; cursor: pointer; }
.acc > summary::-webkit-details-marker { display: none; }
.acc > summary:hover .acc__icon { background: var(--yellow); }
.acc__title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tag { font: 700 11px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 4px 6px; border: 1.5px dashed var(--ink); border-radius: 4px; }
.acc__icon { position: relative; flex: none; width: 28px; height: 28px; border: var(--line) solid var(--ink); border-radius: 50%; background: var(--paper); transition: transform .2s var(--ease), background-color .2s; }
.acc__icon::before, .acc__icon::after { content: ''; position: absolute; left: 50%; top: 50%; width: 12px; height: 2.5px; background: var(--ink); transform: translate(-50%, -50%); }
.acc__icon::after { transform: translate(-50%, -50%) rotate(90deg); }
.acc[open] .acc__icon { transform: rotate(45deg); background: var(--yellow); }
.acc__body { padding: 0 16px 16px; font-size: var(--fs-small); line-height: 1.55; display: grid; gap: 12px; }
.acc__body .lead { font-size: var(--fs-body); line-height: 1.5; }
.acc--suggest { border-style: dashed; }
.list { display: grid; gap: 8px; }
.list li { position: relative; padding-left: 16px; }
.list li::before { content: ''; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; background: var(--ink); border-radius: 1px; }
.gpsr { font-size: 13px; line-height: 1.45; margin-top: 4px; }
/* thin */
.accs--thin .acc { border-width: var(--thin); }
.accs--thin .acc__icon { border-width: var(--thin); }
.accs--thin .acc__icon::before, .accs--thin .acc__icon::after { height: 1.5px; }
/* rules: no boxes, a line between rows */
.accs--rule { gap: 0; border-top: var(--line) solid var(--ink); }
.accs--rule .acc { border: 0; border-bottom: var(--hair) solid var(--ink); border-radius: 0; }
.accs--rule .acc > summary { padding: 18px 0; }
.accs--rule .acc__body { padding: 0 0 20px; }
.accs--rule .acc--suggest { border-bottom-style: dashed; }
/* No rotation here: the icon sits on the column edge, and a rotated square would grow past it.
   Plus becomes minus instead. */
.accs--rule .acc__icon { border: 0; width: 24px; height: 24px; transform: none; }
.accs--rule .acc[open] .acc__icon { transform: none; }
.accs--rule .acc__icon::after { transition: opacity .2s var(--ease); }
.accs--rule .acc[open] .acc__icon::after { opacity: 0; }
.accs--rule .acc[open] .acc__icon { background: transparent; }
.accs--rule .acc > summary:hover .acc__icon { background: transparent; }
.accs--rule .acc > summary:hover .label { text-decoration: underline; text-decoration-color: var(--yellow); text-decoration-thickness: 4px; text-underline-offset: 4px; }

/* ================= Direction B · Panel ================= */
.dirB .panel { border: var(--line) solid var(--ink); border-radius: var(--radius); background: var(--paper); box-shadow: var(--shadow); padding: var(--pad); display: flex; flex-direction: column; gap: var(--gap); margin: 0 var(--sh) var(--sh) 0; }
.seg { border: var(--line) solid var(--ink); border-radius: var(--radius); overflow: hidden; }
.seg .choice { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; min-height: var(--choice-h); padding: 8px 12px; text-align: center; background: var(--paper); transition: background-color .12s; }
.seg .choice + .choice { border-left: var(--line) solid var(--ink); }
.seg .choice:hover { background: color-mix(in srgb, var(--yellow) 35%, var(--paper)); }
.seg .choice:has(input:checked) { background: var(--yellow); }
.seg .choice:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: -7px; }
.seg .choice:has(input:disabled) { background: var(--paper); }
@container (max-width: 319px) { .seg[data-n='2'] .choice + .choice { border-left: 0; border-top: var(--line) solid var(--ink); } }
@container (max-width: 439px) { .seg[data-priced] .choice + .choice { border-left: 0; border-top: var(--line) solid var(--ink); } }
@container (max-width: 439px) { .seg[data-n='3'] .choice + .choice { border-left: 0; border-top: var(--line) solid var(--ink); } }

/* ================= Direction L · Light panel ================= */
.dirL .panel { border: var(--thin) solid var(--ink); border-radius: var(--radius); background: var(--paper); padding: var(--pad); display: flex; flex-direction: column; gap: var(--gap); }
.dirL .seg { border-width: var(--thin); }
.dirL .seg .choice + .choice { border-left-width: var(--thin); }
.dirL .seg .choice + .choice { border-top-width: var(--thin); }

/* ================= Direction F · Frameless ================= */
/* Choices are text radios: a dot and the name; the chosen name gets a yellow highlighter stroke. */
.radios { gap: 8px 24px; }
.radios .choice { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 0; }
.radios .dot { flex: none; width: 18px; height: 18px; border: var(--line) solid var(--ink); border-radius: 50%; background: var(--paper); transition: background-color .12s; }
.radios .choice:hover .dot { background: color-mix(in srgb, var(--yellow) 50%, var(--paper)); }
.radios .choice:has(input:checked) .dot { background: radial-gradient(circle, var(--ink) 0 4px, var(--yellow) 4.5px); }
.radios .txt { display: flex; flex-direction: column; }
.radios .cname { padding: 0 2px; transition: background .12s; }
.radios .choice:has(input:checked) .cname { background: linear-gradient(transparent 55%, var(--yellow) 55%, var(--yellow) 92%, transparent 92%); }
.radios .choice:has(input:focus-visible) .dot { outline: 3px solid var(--ink); outline-offset: 3px; }
/* Text radios flow like words in a line and wrap whole */
.choices.radios { display: flex; flex-wrap: wrap; }
.radios .choice { flex: 0 0 auto; }

/* ================= Direction E · Editorial ================= */
/* A printed page: a heavy rule under the title, hairlines between rows, a label column on the left. */
.dirE .page { display: flex; flex-direction: column; }
.dirE .head { padding-bottom: 24px; border-bottom: var(--line) solid var(--ink); }
.dirE .row { display: grid; grid-template-columns: 8em minmax(0, 1fr); gap: 8px 16px; align-items: start; padding: 20px 0; border: 0; border-bottom: var(--hair) solid var(--ink); margin: 0; min-width: 0; }
.dirE .row > legend, .dirE .row > .rowlabel { float: left; margin: 0; padding: 0; padding-top: 14px; }
.dirE .row .label { font-size: var(--fs-small); font-family: var(--body); font-weight: 700; letter-spacing: .08em; }
.dirE .row .opt__note { grid-column: 2; margin-top: 0; }
.dirE .ctarow { padding-top: 24px; }
@media (max-width: 479px) { .dirE .row { grid-template-columns: minmax(0, 1fr); } .dirE .row > legend { padding-top: 0; } .dirE .row .opt__note { grid-column: 1; } }

/* ================= Direction S · Strip ================= */
/* A comic strip: separate panels with gutters, uneven widths, thin frames; only the button casts a shadow. */
.dirS .strip { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; }
.dirS .p { border: var(--line) solid var(--ink); border-radius: var(--radius); padding: calc(var(--pad) * .75); min-width: 0; background: var(--paper); }
.dirS .p--title { grid-column: 1 / -1; }
.dirS .p--price { display: flex; align-items: center; }
.dirS .p--opts { display: flex; flex-direction: column; }
.dirS .p--cta { grid-column: 1 / -1; }
.dirS .p--cta .ship { margin-top: 12px; justify-content: center; width: 100%; }
.dirS .p--opts.wide { grid-column: 1 / -1; }
@media (max-width: 749px) { .dirS .strip { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Mobile sticky bar ---------- */
.sticky { display: none; }
@media (max-width: 749px) {
  body.show-sticky .sticky { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px calc(4vw + 15px) calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border-top: var(--line) solid var(--ink); }
  .sticky__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .sticky__text .label { font-size: var(--fs-body); }
  .sticky .btn { min-height: 44px; padding: 8px 16px; box-shadow: 3px 3px 0 var(--ink); margin-right: 3px; }
}

/* ---------- Zoom (PhotoSwipe look) ---------- */
.zoom { position: fixed; inset: 0; z-index: 10; background: var(--paper); display: none; flex-direction: column; }
body.show-zoom .zoom { display: flex; }
.zoom__bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); border-bottom: var(--line) solid var(--ink); }
.zoom__stage { flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.zoom__stage img { width: 170%; max-width: none; transform: translate(12%, 6%); }
.zoom__hint { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: var(--line) solid var(--ink); text-align: center; }
.zoom .btn { min-height: 44px; padding: 8px 14px; box-shadow: 3px 3px 0 var(--ink); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="board" id="board"></div>

<header class="wrap site" aria-hidden="true">
  <span class="site__nav"><span>Walterin</span><span>Shop</span><span>About</span></span>
  <span class="site__logo">Walterin</span>
  <span class="site__icons"><span>⌕</span><span>◯</span><span>▢</span></span>
</header>

<main class="pdp">
  <div class="wrap grid" id="pdp">
    <div class="gal" id="gal"></div>
    <div id="col"></div>
  </div>
</main>

<div class="sticky" id="sticky"></div>
<div class="zoom" id="zoom"></div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var S = { dir: q.get('dir') || 'B', product: q.get('product') || 'tarot', state: q.get('state') || '', lang: q.get('lang') || 'en', extra: q.get('extra') || '' };
  if (!S.state) S.state = S.product === 'book' ? 'printed' : 'coming_soon';
  if (q.get('board') === '0') document.body.classList.add('noboard');
  if (S.extra === 'sticky') document.body.classList.add('show-sticky');
  if (S.extra === 'zoom') document.body.classList.add('show-zoom');
  document.documentElement.lang = S.lang;
