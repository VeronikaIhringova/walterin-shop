<title>S2 · How a card is read</title>
<!--
  Mock-up only. The annotated print, final direction:
    · the note and the card only — the path card moved behind "See the whole system" (a dialog)
    · the note names both coordinates: ROW and FIELD (riadok / pole)
    · the walk goes one frame at a time and the dots fill as that frame's time runs out
    · the layout uses the width, not the height: one screen at 1440 x 900 with room to spare
    · the arrow is one clean line with a small head, aimed along the line into the frame's centre
      and stopping 10px short of the card. It never touches the artwork.
  Frame geometry and the path card's fields are measured, not estimated.
  URL: ?lang=en|sk · card=0..9 · frame=0..8 · board=0
-->

<style>
@font-face { font-family: 'WalterinBold'; src: url('https://cdn.shopify.com/s/files/1/0897/8864/5705/files/WalterinBold.woff2?v=1725196093') format('woff2'); font-display: swap; }
:root {
  --paper: #FFFDF7; --ink: #222222; --yellow: #FCF205;
  --line: 2.5px; --thin: 1.5px; --radius: 8px;
  --display: 'WalterinBold', 'Chalkboard SE', sans-serif;
  --body: 'Inter', system-ui, sans-serif;
  --fs-heading: 30px; --fs-label: 18px; --fs-body: 15px; --fs-small: 13.5px;
  /* the page frame and the spacing steps the rest of the page uses */
  --frame: 92%; --frame-max: 1400px; --frame-pad: 15px;
  --s8: 8px; --s12: 12px; --s16: 16px; --s24: 24px; --s32: 32px; --s48: 48px;
  --ease: cubic-bezier(.2,.75,.2,1);
}
@media (min-width: 750px) { :root { --fs-heading: 38px; --fs-label: 21px; --fs-body: 16px; --fs-small: 14px; --frame-pad: 50px; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: var(--fs-body); line-height: 1.5; overflow-wrap: normal; word-break: normal; hyphens: none; -webkit-font-smoothing: antialiased; }
p, h1, h2, h3, figure, figcaption { margin: 0; padding: 0; }
img { display: block; max-width: 100%; height: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.sr { position: absolute !important; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.board { font: 13px/1.4 var(--body); background: #fff; border-bottom: 1px dashed #999; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.board a { color: inherit; padding: 2px 6px; border: 1px solid #bbb; border-radius: 4px; text-decoration: none; }
.board a[aria-current='true'] { background: var(--yellow); border-color: var(--ink); }
.board .grp { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
body.noboard .board { display: none; }

.wrap { width: var(--frame); max-width: var(--frame-max); margin-inline: auto; padding-inline: var(--frame-pad); }
.sec { padding-block: var(--s32); }
@media (min-width: 990px) { .sec { padding-block: var(--s48); } }
.title { font-family: var(--display); font-size: var(--fs-heading); line-height: 1.05; letter-spacing: .01em; text-transform: uppercase; }
.small { font-size: var(--fs-small); line-height: 1.4; }
.lead { font-size: var(--fs-body); line-height: 1.45; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 6px 16px;
  font-family: var(--display); font-size: var(--fs-body); line-height: 1; letter-spacing: .03em; text-transform: uppercase;
  background: var(--yellow); border: var(--line) solid var(--ink); border-radius: var(--radius); box-shadow: 3px 3px 0 var(--ink);
  transition: transform .12s var(--ease), box-shadow .12s var(--ease); margin: 0 3px 3px 0; }
.btn:hover { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.btn--ghost { background: var(--paper); }
#walk { min-width: 11.5em; }

/* a quiet link, not a button */
.quiet { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-small); color: inherit;
  background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px;
  text-decoration-thickness: 1px; cursor: pointer; }
.quiet--grid::before { content: ''; width: 15px; height: 15px; flex: none; border: var(--thin) solid var(--ink); border-radius: 2px;
  background: linear-gradient(var(--ink) 0 0) 0 33% / 100% 1.5px no-repeat, linear-gradient(var(--ink) 0 0) 0 67% / 100% 1.5px no-repeat; }

/* ---------- the layout: the width does the work ---------- */
.s2grid { position: relative; display: grid; gap: var(--s24); margin-top: var(--s24); }
@media (min-width: 990px) {
  /* intro · note · card, one spacing step between them; the row spans the content edges, so the
     intro starts exactly under the headline and the card ends on the right content edge */
  .s2grid { grid-template-columns: 340px minmax(0,1fr) 280px; align-items: start; gap: 0 var(--s48); margin-top: var(--s48); }
  .intro { grid-column: 1; }
  .noteslot { grid-column: 2; }
  .print__card { grid-column: 3; width: 280px; }
}
.intro { display: grid; gap: var(--s12); align-content: start; max-width: 46ch; }

/* a card */
.cardbox { position: relative; border-radius: var(--radius); overflow: hidden; box-shadow: 3px 3px 0 rgb(34 34 34 / .28); }
.cardbox img { width: 100%; border: var(--line) solid var(--ink); border-radius: var(--radius); background: var(--paper); }
.ring { position: absolute; border: 3px solid var(--ink); border-radius: 3px; pointer-events: none;
  transform-origin: top left;
  transition: left .22s var(--ease), top .22s var(--ease), width .22s var(--ease), height .22s var(--ease),
              transform .22s var(--ease);
  box-shadow: 0 0 0 9999px rgb(255 253 247 / .58); }
.hot { position: absolute; border: 0; background: transparent; cursor: pointer; }
.hot::after { content: attr(data-n); position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border: var(--thin) solid var(--ink);
  border-radius: 50%; background: var(--paper); font: 700 9px/14px var(--body); text-align: center; opacity: .9; }
.crop { background-repeat: no-repeat; border: var(--line) solid var(--ink); border-radius: 6px; background-color: var(--paper); }
.cardname { display: block; margin-top: var(--s12); text-align: center; font-family: var(--display);
  font-size: 17px; line-height: 1.1; letter-spacing: .02em; text-transform: uppercase; }
@media (min-width: 990px) { .cardname { font-size: 21px; } }

/* the note: the frame on the left, what it is on the right */
.note { border: var(--line) solid var(--ink); border-radius: var(--radius); background: var(--paper);
  box-shadow: 4px 4px 0 rgb(34 34 34 / .28); padding: var(--s16); display: grid; gap: var(--s12) var(--s16);
  align-content: start; min-height: 540px; }   /* the tallest of the nine, in either language */
@media (min-width: 990px) { .note { grid-template-columns: 210px minmax(0,1fr); min-height: 408px; } }   /* the tallest of the nine in either language */
.note__n { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
@media (min-width: 990px) { .note__n { grid-column: 1 / -1; margin-bottom: -6px; } }
.note .crop { width: 100%; max-width: 230px; }
@media (min-width: 990px) { .note .crop { width: 210px; max-width: none; align-self: start; } }
.note__text { display: grid; gap: var(--s8); align-content: start; }
.note__cap { font-family: var(--display); font-size: 20px; line-height: 1.1; text-transform: uppercase; letter-spacing: .02em; }
@media (min-width: 990px) { .note__cap { font-size: 23px; } }
/* both coordinates, each labelled, so neither can be read as the other */
.coord { display: grid; gap: 0; margin: 0; }
.coord dt { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.coord dt + dd { margin: 1px 0 7px; }
.coord dd:last-of-type { margin-bottom: 0; }
.coord dd { margin: 0; font-family: var(--display); font-size: 16px; line-height: 1.1; letter-spacing: .03em; text-transform: uppercase; }
@media (min-width: 990px) { .coord dd { font-size: 17px; } }

.link { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; overflow: visible; }
.link .shaft { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.link .head { fill: var(--ink); }

/* ---------- controls ---------- */
.steps { display: flex; align-items: center; gap: var(--s12); flex-wrap: wrap; margin-top: var(--s24); }
@media (min-width: 990px) { .steps { justify-content: center; } }
.dots { display: flex; gap: var(--s8); }
.dots .g { display: flex; gap: 3px; }
.dot { position: relative; width: 11px; height: 11px; border: var(--thin) solid var(--ink); border-radius: 50%;
  overflow: hidden; background: var(--paper); }
.dot i { position: absolute; inset: -1px; background: var(--yellow); transform: scaleY(0); transform-origin: bottom; }
.dot.on i { transform: scaleY(1); }
.dot.done { background: var(--ink); }
.pickerline { display: flex; align-items: center; gap: var(--s12); flex-wrap: wrap; max-width: 100%; }
.pickerline .picker { flex: 1 1 auto; min-width: 0; }
.steps .pickerline { flex: 1 1 100%; min-width: 0; justify-content: center; }
@media (min-width: 990px) { .steps .picker { flex: 0 1 auto; } }
@media (max-width: 989px) { .steps .pickerline { justify-content: flex-start; } }
.picker { display: flex; gap: 7px; max-width: 100%; overflow-x: auto; padding: 2px 0; }
.picker button { position: relative; flex: none; width: 38px; aspect-ratio: 800/1314; border: var(--thin) solid var(--ink); border-radius: 4px; overflow: hidden; background: var(--paper); }
.picker button img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.picker button[aria-pressed='true'] { outline: 3px solid var(--yellow); outline-offset: -3px; }
.picker button::after { content: attr(data-name); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%);
  white-space: nowrap; font-size: 12px; background: var(--paper); border: var(--thin) solid var(--ink); border-radius: 4px; padding: 2px 6px;
  opacity: 0; pointer-events: none; transition: opacity .12s var(--ease); z-index: 6; }
.picker button:hover::after, .picker button:focus-visible::after { opacity: 1; }

/* ---------- the whole system, on request ---------- */
.dlg { border: var(--line) solid var(--ink); border-radius: var(--radius); background: var(--paper); color: var(--ink);
  padding: var(--s24); max-width: min(92vw, 380px); box-shadow: 6px 6px 0 rgb(34 34 34 / .28); }
.dlg::backdrop { background: rgb(34 34 34 / .35); }
.dlg__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s16); margin-bottom: var(--s12); }
.dlg h3 { font-family: var(--display); font-size: var(--fs-label); text-transform: uppercase; letter-spacing: .03em; }
.dlg__cap { font-size: var(--fs-small); margin-top: var(--s12); }

/* ---------- phone: the note and the card side by side, the gutter between them ---------- */
@media (max-width: 989px) {
  .s2grid { grid-template-columns: minmax(0,1fr) 34px 132px; gap: var(--s16) 0; }
  .intro { grid-column: 1 / -1; grid-row: 1; }
  .noteslot { grid-column: 1; grid-row: 2; min-width: 0; }
  .print__card { grid-column: 3; grid-row: 2; width: 132px; }
  .note .crop { max-width: 128px; }
}

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var S = { lang: q.get('lang') || 'en', card: +(q.get('card') || 0), frame: +(q.get('frame') || 0) };
  if (q.get('board') === '0') document.body.classList.add('noboard');
  document.documentElement.lang = S.lang;
  var CARDS = JSON.parse(document.getElementById('carddata').textContent).cards;
  var ASSET = '../../../assets/';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* the path card's grid lines, measured, as percentages of the whole card */
  var PATH = { cols: [13.54, 39.00, 65.09, 91.97], rows: [10.10, 35.97, 60.93, 85.02] };
  /* the printed path card, in the reader's language. Both are the same artwork, so the same grid. */
  var PATHCARD = ASSET + 'nine-frame-path-card' + (S.lang === 'sk' ? '-sk' : '');
  /* the field names, as printed on the path card, row by row */
  var FIELDS = {
    en: [['Chance', 'Idea', 'Value'], ['Openness', 'Meaning', 'Trust'], ['To try', 'To develop', 'To create']],
    sk: [['Šanca', 'Idea', 'Hodnota'], ['Otvorenosť', 'Zmysel', 'Dôvera'], ['Skúšať', 'Rozvíjať', 'Tvoriť']]
  }[S.lang];

  var T = {
    en: {
      h: 'How a card is read',
      intro: 'Every card is a nine-frame comic. Read it in three rows: the top row is what to understand, the middle what to accept, the bottom what to transform.',
      rows: ['What to understand', 'What to accept', 'What to transform'],
      why: [
        'What is going on, and what to notice in it.',
        'What is yours, and what to admit before anything moves.',
        'Where it leads, and what you can change.'
      ],
      hint: 'Step through the nine frames, or click one on the card.',
      pick: 'Try another card', back: 'Back', next: 'Next', frameOf: 'Frame [n] of 9',
      rowWord: 'Row', fieldWord: 'Field',
      walk: 'Walk me through it', stop: 'Stop',
      system: 'See the whole system', systemH: 'The nine-frame path',
      systemCap: 'The nine-frame path. Its own card, in the box. The lit field is where this frame sits.',
      close: 'Close'
    },
    sk: {
      h: 'Ako sa číta karta',
      intro: 'Každá karta je deväťobrázkový komiks. Číta sa v troch riadkoch: hore to, čo máte pochopiť, v strede to, čo prijať, dole to, čo zmeniť.',
      rows: ['Čo pochopiť', 'Čo prijať', 'Čo zmeniť'],
      why: [
        'Čo sa deje a čoho si v tom treba všimnúť.',
        'Čo je vaše a čo si priznať, aby sa pohlo.',
        'Kam to vedie a čo sa dá zmeniť.'
      ],
      hint: 'Prechádzajte deviatimi obrázkami alebo kliknite na niektorý v karte.',
      pick: 'Skúsiť inú kartu', back: 'Späť', next: 'Ďalej', frameOf: 'Obrázok [n] z 9',
      rowWord: 'Riadok', fieldWord: 'Pole',
      walk: 'Prevedie ma tým', stop: 'Zastaviť',
      system: 'Celý systém', systemH: 'Cesta v 9 krokoch',

  var card = CARDS[S.card] || CARDS[0];
  function src(c) { return ASSET + c.file; }
  function el(h) { var d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; }
  function rowOf(i) { return Math.floor(i / 3); }

  function cropStyle(c, i) {
    var g = c.grid, r = rowOf(i), col = i % 3;
    var fw = (g.cols[col + 1] - g.cols[col]) / 100, fh = (g.rows[r + 1] - g.rows[r]) / 100;

  function pathRing(i) {

    return h;
  }
  function noteHTML() {

      '<span class="note__text">' +

    return [0,1,2].map(function (rr) {
      return '<span class="g">' + [0,1,2].map(function (cc) {
        var i = rr * 3 + cc;
        return '<span class="dot ' + (i === S.frame ? 'on' : (i < S.frame ? 'done' : '')) + '" data-dot="' + i + '"><i></i></span>'; }).join('') + '</span>';
    }).join('');
  }
  function pickerHTML() {
    return '<div class="pickerline"><span class="small">' + T.pick + '</span><div class="picker">' +
      CARDS.map(function (c, i) { return '<button type="button" data-card="' + i + '" data-name="' + c.name + '" aria-pressed="' + (i === S.card) + '" aria-label="' + c.name + '"><img src="' + src(c) + '" alt="" width="800" height="1314"></button>'; }).join('') +
      '</div></div>';
  }

  document.getElementById('main').appendChild(el(
    '<section class="sec"><div class="wrap">' +
      '<h2 class="title">' + T.h + '</h2>' +
      '<div class="s2grid" id="grid">' +
        '<div class="intro"><p class="lead">' + T.intro + '</p><p class="small">' + T.hint + '</p>' +
          '<p><button class="quiet quiet--grid" type="button" id="sysbtn">' + T.system + '</button></p></div>' +
        '<span class="noteslot" id="noteslot">' + noteHTML() + '</span>' +
        '<div class="print__card" id="printcard">' + cardBox(card, S.frame) + '<span class="cardname">' + card.name + '</span></div>' +
        '<svg class="link" id="link" aria-hidden="true"></svg>' +
      '</div>' +
      '<div class="steps">' +
        '<button class="btn btn--ghost" type="button" data-step="-1">' + T.back + '</button>' +
        '<span class="dots" id="dots">' + dotsHTML() + '</span>' +
        '<button class="btn btn--ghost" type="button" data-step="1">' + T.next + '</button>' +
        '<button class="btn" type="button" id="walk" aria-pressed="false">' + T.walk + '</button>' +
        pickerHTML() +
      '</div>' +
    '</div></section>'));

  /* the whole system, on request */
  var dlg = el('<dialog class="dlg" id="sysdlg" aria-label="' + T.systemH + '">' +
    '<div class="dlg__head"><h3>' + T.systemH + '</h3><button class="quiet" type="button" id="sysclose">' + T.close + '</button></div>' +
    '<div class="cardbox"><picture><source srcset="' + PATHCARD + '.webp" type="image/webp">' +
    '<img src="' + PATHCARD + '.png" alt="' + T.systemH + '" width="800" height="1314"></picture>' +
    '<span class="ring" id="pring" style="' + pathRing(S.frame) + '"></span></div>' +
    '<p class="dlg__cap">' + T.systemCap + '</p></dialog>');
  document.body.appendChild(dlg);
  document.getElementById('sysbtn').addEventListener('click', function () {
    document.getElementById('pring').setAttribute('style', pathRing(S.frame));
    walkPause('dialog'); dlg.showModal();
  });
  document.getElementById('sysclose').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('close', function () { walkResume('dialog'); });

  /* ---------------- the arrow: one line, aimed along the line into the frame's centre ---------------- */
  function drawLink() {
    var svg = document.getElementById('link'), note = document.getElementById('note');
    if (!svg || !note) return;
    var gr = document.getElementById('grid').getBoundingClientRect();
    var n = note.getBoundingClientRect();
    var cb = document.querySelector('#printcard .cardbox').getBoundingClientRect();
    var g = card.grid, r = rowOf(S.frame), c = S.frame % 3;
    svg.setAttribute('viewBox', '0 0 ' + gr.width + ' ' + gr.height);
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.innerHTML = '';

    /* where the frame actually is */
    var fx = cb.left - gr.left + cb.width * (g.cols[c] + g.cols[c + 1]) / 200;
    var fy = cb.top - gr.top + cb.height * (g.rows[r] + g.rows[r + 1]) / 200;
    /* it leaves the note beside the row it points at, and stops short of the card */
    var x0 = n.right - gr.left + 2;
    var y0 = fy + [46, 0, -46][r];
    var stopX = cb.left - gr.left - 10;
    var dx = fx - x0, dy = fy - y0, len = Math.hypot(dx, dy) || 1;
    var ux = dx / len, uy = dy / len;
    if (ux < .05 || stopX <= x0 + 16) return;     /* no room: draw nothing rather than something wrong */
    var t = (stopX - x0) / ux;                    /* the point on the aim line at the card's edge */
    var tipX = x0 + ux * t, tipY = y0 + uy * t;
    var HEAD = 11, HALF = 4.6, bow = 7;
    /* the shaft stops where the head starts, and the second control sits on the aim line,
       so the head points exactly along the line that runs into the frame's centre */
    var ex = tipX - ux * HEAD, ey = tipY - uy * HEAD;
    var c1x = x0 + ux * t * .34 - uy * bow, c1y = y0 + uy * t * .34 + ux * bow;
    var c2x = ex - ux * t * .28, c2y = ey - uy * t * .28;
    var d = 'M ' + x0.toFixed(1) + ' ' + y0.toFixed(1) +
            ' C ' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) +
            ' ' + ex.toFixed(1) + ' ' + ey.toFixed(1);
    var hd = 'M ' + tipX.toFixed(1) + ' ' + tipY.toFixed(1) +
             ' L ' + (ex - uy * HALF).toFixed(1) + ' ' + (ey + ux * HALF).toFixed(1) +
             ' L ' + (ex + uy * HALF).toFixed(1) + ' ' + (ey - ux * HALF).toFixed(1) + ' Z';
    svg.innerHTML = '<path class="shaft" d="' + d + '"></path><path class="head" d="' + hd + '"></path>';
  }

  /* ---------------- the walk: one frame at a time, and you can see the change coming ----------------
     Timing from docs/design/AUTOPLAY-WALK.md. The frame that opens a row carries the row's
     explanation as well, so it is held longer than the two that follow it. */
  var live = document.getElementById('live');
  var W = { on: false, i: -1, timer: null, endAt: 0, left: 0, fill: null, pauses: {} };
  /* one duration for every frame. The row explanations were shortened to about nine words so the
     frame that opens a row fits the same beat as the two that follow. See AUTOPLAY-WALK.md. */
  var HOLD = S.lang === 'sk' ? 8000 : 7000, BEAT = 800;
  function hold() { return HOLD; }
  var walkBtn;

  function fillDot(i, ms) {
    var dot = document.querySelector('[data-dot="' + i + '"] i');
    if (!dot) return;
    if (reduce) { dot.style.transform = 'scaleY(1)'; return; }
    W.fill = dot.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }],
      { duration: ms, easing: 'linear', fill: 'forwards' });
  }
  function schedule(ms) { W.endAt = Date.now() + ms; W.timer = setTimeout(walkNext, ms); }
  function walkNext() {
    W.i++;
    if (W.i > 8) return walkEnd();
    var beat = W.i > 0 && W.i % 3 === 0 ? BEAT : 0;   /* a beat where the row changes */
    setFrame(W.i, true);
    fillDot(W.i, HOLD);
    schedule(HOLD + beat);
  }
  function walkStart() {
    W.on = true; W.pauses = {};
    W.i = S.frame >= 8 ? -1 : S.frame - 1;            /* it carries on from where you are */
    walkBtn.textContent = T.stop; walkBtn.setAttribute('aria-pressed', 'true');
    walkNext();
  }
  function walkEnd() {
    if (!W.on) return;
    clearTimeout(W.timer);
    if (W.fill) { W.fill.cancel(); W.fill = null; }
    W.on = false; W.i = -1; W.pauses = {};
    walkBtn.textContent = T.walk; walkBtn.setAttribute('aria-pressed', 'false');
  }
  function walkPause(why) {
    if (!W.on) return;
    var was = Object.keys(W.pauses).length;
    W.pauses[why] = 1;
    if (!was) { clearTimeout(W.timer); W.left = Math.max(400, W.endAt - Date.now()); if (W.fill) W.fill.pause(); }
  }
  function walkResume(why) {
    if (!W.on || !W.pauses[why]) return;
    delete W.pauses[why];
    if (!Object.keys(W.pauses).length) { schedule(W.left); if (W.fill) W.fill.play(); }
  }

  /* during the walk the highlight moves by transform: nine moves, no layout shift.
     A move you make yourself is a move you asked for, so that one sets the geometry directly. */
  function slideRing(node, i) {
    var g = card.grid, r = rowOf(i), c = i % 3;
    var bw = g.cols[1] - g.cols[0], bh = g.rows[1] - g.rows[0];
    var w = g.cols[c + 1] - g.cols[c], h = g.rows[r + 1] - g.rows[r];
    node.style.transform = 'translate(' + ((g.cols[c] - g.cols[0]) / bw * 100).toFixed(2) + '%,' +
      ((g.rows[r] - g.rows[0]) / bh * 100).toFixed(2) + '%) scale(' + (w / bw).toFixed(4) + ',' + (h / bh).toFixed(4) + ')';
  }
  function setFrame(i, fromWalk) {
    if (!fromWalk && W.fill) { W.fill.cancel(); W.fill = null; }
    S.frame = (i + 9) % 9;
    var ring = document.getElementById('ring');
    if (fromWalk) {
      if (!ring.dataset.based) { ring.setAttribute('style', frameRing(card, 0)); ring.dataset.based = '1'; }
      slideRing(ring, S.frame);
    } else {
      ring.style.transform = ''; delete ring.dataset.based;
      ring.setAttribute('style', frameRing(card, S.frame));
    }
    document.getElementById('noteslot').innerHTML = noteHTML();
    document.getElementById('dots').innerHTML = dotsHTML();
    var pr = document.getElementById('pring');
    if (pr) pr.setAttribute('style', pathRing(S.frame));
    drawLink();
    var p = new URLSearchParams(location.search); p.set('frame', S.frame);
    history.replaceState(null, '', '?' + p);
    live.textContent = T.rows[rowOf(S.frame)] + ' · ' + FIELDS[rowOf(S.frame)][S.frame % 3] + ' · ' + card.captions[S.frame];
  }

  walkBtn = document.getElementById('walk');
  walkBtn.addEventListener('click', function () { W.on ? walkEnd() : walkStart(); });
  document.addEventListener('click', function (e) {
    if (e.target.closest('#walk') || e.target.closest('.dlg') || e.target.closest('#sysbtn')) return;
    var f = e.target.closest('[data-frame]');
    if (f) { walkEnd(); return setFrame(+f.dataset.frame); }
    var s = e.target.closest('[data-step]');
    if (s) { walkEnd(); return setFrame(S.frame + (+s.dataset.step)); }
    var c = e.target.closest('[data-card]');
    if (c) { var p = new URLSearchParams(location.search); p.set('card', c.dataset.card); p.set('frame', 0); location.search = p; }
  });
  /* capture, so Escape is read before the dialog closes itself: closing the dialog must not stop the walk */
  document.addEventListener('keydown', function (e) {
    if (dlg.open) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); walkEnd(); setFrame(S.frame + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); walkEnd(); setFrame(S.frame - 1); }
    if (e.key === 'Escape') walkEnd();
  }, true);
  document.addEventListener('focusin', function (e) {
    if (W.on && !e.target.closest('#walk') && !e.target.closest('#sysbtn') && !e.target.closest('.dlg') &&
        document.getElementById('grid').contains(e.target)) walkEnd();
  });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) {
      es.forEach(function (en) { en.intersectionRatio < .5 ? walkPause('view') : walkResume('view'); });
    }, { threshold: [0, .5, 1] }).observe(document.getElementById('grid'));
  }
  document.addEventListener('visibilitychange', function () { document.hidden ? walkPause('tab') : walkResume('tab'); });

  drawLink();
  window.addEventListener('resize', drawLink);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawLink);
  document.querySelectorAll('#printcard img').forEach(function (im) { if (!im.complete) im.addEventListener('load', drawLink); });

  function link(k, v, label) { var p = new URLSearchParams(location.search); p.set(k, v); return '<a href="?' + p + '" aria-current="' + (String(S[k]) === String(v)) + '">' + (label || v) + '</a>'; }
  document.getElementById('board').innerHTML =
    '<span class="grp"><b>Frame</b>' + [0,1,2,3,4,5,6,7,8].map(function (i) { return link('frame', i, 'f' + (i+1)); }).join('') + '</span>' +
    '<span class="grp"><b>Card</b>' + [0,2,3].map(function (i) { return link('card', i, CARDS[i].name.split(' ')[0]); }).join('') + '</span>' +
    '<span class="grp"><b>Lang</b>' + link('lang','en','EN') + link('lang','sk','SK') + '</span>';
})();
</script>
</body>
</html>
