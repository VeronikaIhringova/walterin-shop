<title>S2 · How a card is read</title>
<!--
  Mock-up only. The annotated print as it was, plus one thing: the nine-frame path, shown as what it is —
  another card from the box, the same size and shape as the tarot card beside it, always on screen.
  Palette: ink, paper, yellow. The artwork brings the colour.
  The arrow lives in the gutter between the note and the card. It never crosses into the artwork:
  it stops at the card's edge and points at the row the frame is in — climbing, level, or falling.
  URL: ?lang=en|sk · card=0..9 · frame=0..8 · state=dealt · board=0
-->

<style>
@font-face { font-family: 'WalterinBold'; src: url('https://cdn.shopify.com/s/files/1/0897/8864/5705/files/WalterinBold.woff2?v=1725196093') format('woff2'); font-display: swap; }
:root {
  --paper: #FFFDF7; --ink: #222222; --yellow: #FCF205;
  --line: 2.5px; --thin: 1.5px; --radius: 8px;
  --display: 'WalterinBold', 'Chalkboard SE', sans-serif;
  --body: 'Inter', system-ui, sans-serif;
  --fs-heading: 30px; --fs-label: 18px; --fs-body: 15px; --fs-small: 13.5px;
  --frame-pad: 15px; --ease: cubic-bezier(.2,.75,.2,1);
}
@media (min-width: 750px) { :root { --fs-heading: 38px; --fs-label: 21px; --fs-body: 16px; --fs-small: 14px; --frame-pad: 50px; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: var(--fs-body); line-height: 1.5; overflow-wrap: normal; word-break: normal; hyphens: none; -webkit-font-smoothing: antialiased; }
p, h1, h2, h3, figure, figcaption { margin: 0; padding: 0; }
img { display: block; max-width: 100%; height: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.sr { position: absolute !important; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.board { font: 13px/1.4 var(--body); background: #fff; border-bottom: 1px dashed #999; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.board a { color: inherit; padding: 2px 6px; border: 1px solid #bbb; border-radius: 4px; text-decoration: none; }
.board a[aria-current='true'] { background: var(--yellow); border-color: var(--ink); }
.board .grp { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
body.noboard .board { display: none; }

.wrap { width: 92%; max-width: 1400px; margin-inline: auto; padding-inline: var(--frame-pad); }
.sec { padding-block: 30px; }
@media (min-width: 990px) { .sec { padding-block: 42px; } }
.title { font-family: var(--display); font-size: var(--fs-heading); line-height: 1.05; letter-spacing: .01em; text-transform: uppercase; }
.small { font-size: var(--fs-small); line-height: 1.4; }
.lead { font-size: var(--fs-body); line-height: 1.45; max-width: 58ch; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 6px 16px;
  font-family: var(--display); font-size: var(--fs-body); line-height: 1; letter-spacing: .03em; text-transform: uppercase;
  background: var(--yellow); border: var(--line) solid var(--ink); border-radius: var(--radius); box-shadow: 3px 3px 0 var(--ink);
  transition: transform .12s var(--ease), box-shadow .12s var(--ease); margin: 0 3px 3px 0; }
.btn:hover { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.btn--ghost { background: var(--paper); }

.s2head { display: grid; grid-template-columns: minmax(0,1fr); gap: 8px; margin-bottom: 20px; }
.s2head__text { display: grid; gap: 8px; max-width: 62ch; }
.pickerline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; max-width: 100%; }
.pickerline .picker { flex: 1 1 auto; min-width: 0; }
.steps .pickerline { flex: 1 1 100%; min-width: 0; }
.picker { display: flex; gap: 7px; max-width: 100%; overflow-x: auto; padding: 2px 0; }
.picker button { position: relative; flex: none; width: 38px; aspect-ratio: 800/1314; border: var(--thin) solid var(--ink); border-radius: 4px; overflow: hidden; background: var(--paper); }
.picker button img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.picker button[aria-pressed='true'] { outline: 3px solid var(--yellow); outline-offset: -3px; }
.picker button::after { content: attr(data-name); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%);
  white-space: nowrap; font-size: 12px; background: var(--paper); border: var(--thin) solid var(--ink); border-radius: 4px; padding: 2px 6px;
  opacity: 0; pointer-events: none; transition: opacity .12s var(--ease); z-index: 6; }
.picker button:hover::after, .picker button:focus-visible::after { opacity: 1; }
.now { font-family: var(--display); font-size: var(--fs-label); text-transform: uppercase; letter-spacing: .02em; }

/* a card — the tarot card and the path card are built the same way */
.cardbox { position: relative; border-radius: var(--radius); overflow: hidden; box-shadow: 3px 3px 0 rgb(34 34 34 / .28); }
.cardbox img { width: 100%; border: var(--line) solid var(--ink); border-radius: var(--radius); background: var(--paper); }
.ring { position: absolute; border: 3px solid var(--ink); border-radius: 3px; pointer-events: none;
  transition: left .22s var(--ease), top .22s var(--ease), width .22s var(--ease), height .22s var(--ease);
  box-shadow: 0 0 0 9999px rgb(255 253 247 / .58); }
.hot { position: absolute; border: 0; background: transparent; cursor: pointer; }
.hot::after { content: attr(data-n); position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border: var(--thin) solid var(--ink);
  border-radius: 50%; background: var(--paper); font: 700 9px/14px var(--body); text-align: center; opacity: .9; }
.crop { background-repeat: no-repeat; border: var(--line) solid var(--ink); border-radius: 6px; background-color: var(--paper); }

/* the note in the margin — always on the left */
.print { position: relative; display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; }
/* the explanation is the main object on the line: biggest type, deepest shadow, most room */
.note { border: var(--line) solid var(--ink); border-radius: var(--radius); background: var(--paper);
  box-shadow: 4px 4px 0 rgb(34 34 34 / .28); padding: 14px; display: grid; gap: 9px; width: 100%;
  align-content: start; min-height: 566px; }   /* the tallest state in either language, so nothing below ever moves */
@media (min-width: 990px) { .note { padding: 16px; min-height: 536px; } }
.note__n { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.note .crop { width: 150px; }
@media (min-width: 990px) { .note .crop { width: 184px; } }
.note__cap { font-family: var(--display); font-size: 20px; line-height: 1.1; text-transform: uppercase; letter-spacing: .02em; }
@media (min-width: 990px) { .note__cap { font-size: 24px; } }
/* both coordinates, spelled out, so neither can be mistaken for the other */
.coord { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 2px 12px; margin: 2px 0 0; }
.coord dt { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; align-self: center; }
.coord dd { margin: 0; font-family: var(--display); font-size: 15px; line-height: 1.15; letter-spacing: .03em; text-transform: uppercase; }
@media (min-width: 990px) { .coord dd { font-size: 16px; } }
/* the walk shows a whole row: its three frames, then its three lines */
.rowstrip { display: flex; gap: 8px; }
.rowstrip .crop { width: 92px; flex: none; }
.rowline { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 3px 10px; font-size: var(--fs-small); }
.rowline b { font-family: var(--display); font-weight: 400; letter-spacing: .03em; text-transform: uppercase; }
.link { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; overflow: visible; }
.link path { fill: var(--ink); }

.cardname { display: block; margin-top: 12px; text-align: center; font-family: var(--display);
  font-size: 17px; line-height: 1.1; letter-spacing: .02em; text-transform: uppercase; }
@media (min-width: 990px) { .cardname { font-size: 21px; } }

/* the path card is reference: same card, quieter — smaller, thinner, no shadow */
.path { display: grid; gap: 8px; justify-items: center; }
.path .cardbox { box-shadow: none; }
.path .cardbox img { border-width: var(--thin); }
.path .ring { border-width: 2px; }
.path__cap { font-size: var(--fs-small); line-height: 1.35; text-align: center; max-width: 30ch; }

.steps { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
/* the button keeps its width when the label switches to Stop, so the bar never reflows */
#walk { min-width: 11.5em; }
.dots { display: flex; gap: 8px; }
.dots .g { display: flex; gap: 3px; }
.dot { width: 9px; height: 9px; border: var(--thin) solid var(--ink); border-radius: 50%; }
.dot.on { background: var(--yellow); }
.dot.done { background: var(--ink); }

/* 1440: note · gutter · card · path card, on one line */
@media (min-width: 990px) {
  /* the middle track is the gutter the arrow lives in; the two cards sit side by side like cards on a table */
  .print__row { display: grid; grid-template-columns: 340px 74px 250px 52px 190px; justify-content: center; align-items: start; gap: 0; }
  .noteslot { grid-column: 1; grid-row: 1; }
  .print__card { grid-column: 3; grid-row: 1; width: 250px; }
  .path { grid-column: 5; grid-row: 1; width: 190px; }
}
/* 390: the same reading order, the path card under the pair */
@media (max-width: 989px) {
  /* the middle track is the gutter, exactly as on the desktop */
  .print__row { display: grid; grid-template-columns: minmax(0,1fr) 40px 140px; gap: 0; align-items: start; }
  .noteslot { grid-column: 1; grid-row: 1; min-width: 0; }
  .print__card { grid-column: 3; grid-row: 1; width: 140px; }
  .note .crop { width: 100%; max-width: 132px; }
  .rowstrip .crop { width: 30%; }
  .path { grid-column: 1 / -1; grid-row: 2; width: 110px; justify-self: center; margin-top: 22px; }
  .steps { justify-content: flex-start; }
}

.readings { margin-top: 30px; padding-top: 24px; border-top: var(--line) solid var(--ink); }
.readings__grid { display: grid; gap: 22px; margin-top: 18px; }
@media (min-width: 750px) { .readings__grid { grid-template-columns: 1fr 1fr; gap: 32px; } }
.reading { display: grid; gap: 10px; align-content: start; }
.reading h3 { font-family: var(--display); font-size: var(--fs-label); text-transform: uppercase; letter-spacing: .03em; }
.deal { display: flex; gap: 10px; }
.deal .slot { width: 76px; aspect-ratio: 800/1314; border: var(--thin) solid var(--ink); border-radius: 6px; overflow: hidden; background:
  repeating-linear-gradient(45deg, var(--yellow) 0 6px, var(--paper) 6px 12px); }
.deal .slot img { width: 100%; height: 100%; object-fit: cover; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

    return '<figure class="path"><div class="cardbox">' +
      '<picture><source srcset="' + ASSET + 'nine-frame-path-card.webp" type="image/webp">' +
      '<img src="' + ASSET + 'nine-frame-path-card.png" alt="' + T.pathAlt + '" width="800" height="1314"></picture>' +
      '<span class="ring" id="pring" style="' + pathRing(S.frame) + '"></span></div>' +
      '<figcaption class="path__cap">' + T.pathCap + '</figcaption></figure>';
  }
  function noteHTML() {
    var r = rowOf(S.frame), c = S.frame % 3;
    return '<div class="note" id="note">' +
      '<span class="note__n">' + T.frameOf.replace('[n]', S.frame + 1) + '</span>' +
      '<span class="crop" style="' + cropStyle(card, S.frame) + '"></span>' +
      '<dl class="coord">' +
        '<dt>' + T.rowWord + '</dt><dd>' + T.rows[r] + '</dd>' +
        '<dt>' + T.colWord + '</dt><dd>' + COLS[r][c] + '</dd>' +
      '</dl>' +
      '<span class="note__cap">' + card.captions[S.frame] + '</span>' +
      '<span class="small">' + T.why[r] + '</span></div>';
  }
  function rowNoteHTML(r) {
    return '<div class="note" id="note">' +
      '<span class="note__n">' + T.rowOf3.replace('[n]', r + 1) + '</span>' +
      '<span class="rowstrip">' + [0,1,2].map(function (c) {
        return '<span class="crop" style="' + cropStyle(card, r * 3 + c) + '"></span>'; }).join('') + '</span>' +
      '<dl class="coord"><dt>' + T.rowWord + '</dt><dd>' + T.rows[r] + '</dd></dl>' +
      '<span class="small">' + T.why[r] + '</span>' +
      '<span class="rowline">' + [0,1,2].map(function (c) {
        return '<b>' + COLS[r][c] + '</b><span>' + card.captions[r * 3 + c] + '</span>'; }).join('') + '</span></div>';
  }
  function ringRow(c, r) {
    var g = c.grid;
    return 'left:' + g.cols[0] + '%;width:' + (g.cols[3] - g.cols[0]) + '%;top:' + g.rows[r] + '%;height:' + (g.rows[r + 1] - g.rows[r]) + '%;';
  }
  function pathRingRow(r) {
    return 'left:' + PATH.cols[0] + '%;width:' + (PATH.cols[3] - PATH.cols[0]) + '%;top:' + PATH.rows[r] + '%;height:' + (PATH.rows[r + 1] - PATH.rows[r]) + '%;';
  }
  function dotsHTML() {
    return [0,1,2].map(function (rr) {
      return '<span class="g">' + [0,1,2].map(function (cc) {
        var i = rr*3+cc; return '<span class="dot ' + (i === S.frame ? 'on' : (i < S.frame ? 'done' : '')) + '"></span>'; }).join('') + '</span>';
    }).join('');
  }
  function pickerHTML() {
    return '<div class="pickerline"><span class="small">' + T.pick + '</span><div class="picker">' +
      CARDS.map(function (c, i) { return '<button type="button" data-card="' + i + '" data-name="' + c.name + '" aria-pressed="' + (i === S.card) + '" aria-label="' + c.name + '"><img src="' + src(c) + '" alt="" width="800" height="1314"></button>'; }).join('') +
      '</div></div>';
  }
  function printHTML() {
    return '<div class="print" id="print">' +
      '<div class="print__row">' +
        '<span class="noteslot" id="noteslot">' + noteHTML() + '</span>' +
        '<div class="print__card" id="printcard">' + cardBox(card, S.frame) +
          '<span class="cardname">' + card.name + '</span></div>' +
        pathCard() +
      '</div>' +
      '<svg class="link" id="link" aria-hidden="true"></svg>' +
      '<div class="steps"><button class="btn btn--ghost" type="button" data-step="-1">' + T.back + '</button>' +
      '<span class="dots" id="dots">' + dotsHTML() + '</span>' +
      '<button class="btn btn--ghost" type="button" data-step="1">' + T.next + '</button>' +
      '<button class="btn" type="button" id="walk" aria-pressed="false">' + T.walk + '</button>' +
      '<span style="width:18px"></span>' + pickerHTML() + '</div></div>';
  }
  function readings() {
    return '<section class="readings"><h2 class="title">' + T.rH + '</h2><p class="lead" style="margin-top:10px">' + T.rIntro + '</p>' +
      '<div class="readings__grid">' +
      '<div class="reading"><h3>' + T.r1 + '</h3><p class="small">' + T.r1t + '</p>' +
        '<div class="deal" id="deal1"><span class="slot"></span></div>' +
        '<div><button class="btn" type="button" id="draw1">' + T.draw1 + '</button></div></div>' +
      '<div class="reading"><h3>' + T.r2 + '</h3><p class="small">' + T.r2t + '</p>' +
        '<div class="deal" id="deal3"><span class="slot"></span><span class="slot"></span><span class="slot"></span></div>' +
        '<div><button class="btn" type="button" id="draw3">' + T.draw3 + '</button></div></div>' +
      '</div></section>';
  }
  document.getElementById('main').appendChild(el('<section class="sec"><div class="wrap">' +
    '<div class="s2head"><div class="s2head__text"><h2 class="title">' + T.h + '</h2>' +
    '<p class="lead">' + T.intro + '</p><p class="small">' + T.hint + '</p></div></div>' +
    printHTML() + readings() + '</div></section>'));

  /* ---------------- the three arrows ----------------
     one drawing per row: a climb, a level run, a fall. Each has its own bow, its own weight
     profile, its own tremble and its own head — the tip stops at the card and never enters it. */
  var ARROWS = {
    climb: {
      bow: function (t) { return 9 * Math.sin(Math.PI * Math.pow(t, .85)); },
      w:   function (t) { return 3.2 + 6.8 * Math.pow(t, .62); },
      trL: function (t) { return 1.0 * Math.sin(t * 5.2 + .6); },
      trR: function (t) { return .8 * Math.sin(t * 3.9 + 2.2); },
      head: { len: 21, w: 25, back: .34, skew: .16 }
    },
    level: {
      bow: function (t) { return 3.4 * Math.sin(2 * Math.PI * t + .35); },
      w:   function (t) { return (4.3 + 5.4 * Math.pow(t, .8)) * (1 - .10 * Math.sin(Math.PI * t * 2)); },
      trL: function (t) { return .9 * Math.sin(t * 4.4 + 1.9); },
      trR: function (t) { return 1.0 * Math.sin(t * 5.8 + .4); },
      head: { len: 22, w: 26, back: .26, skew: -.12 }
    },
    fall: {
      bow: function (t) { return -8.5 * Math.sin(Math.PI * Math.pow(t, 1.25)); },
      w:   function (t) { return 3.6 + 5.8 * Math.pow(t, .55) + 2.2 * Math.exp(-t * 11); },
      trL: function (t) { return .8 * Math.sin(t * 4.1 + 2.8); },
      trR: function (t) { return 1.1 * Math.sin(t * 5.5 + 1.1); },
      head: { len: 20, w: 24, back: .38, skew: .22 }
    }
  };
  function arrowPath(kind, x0, y0, x1, y1, k) {
    var A = ARROWS[kind], H = A.head;
    var dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1;
    var ux = dx / L, uy = dy / L, px = -uy, py = ux;
    var HLEN = H.len * k, HW = H.w * k;
    var shaft = Math.max(L * .34, L - HLEN);
    var N = 30, C = [], i, t;
    for (i = 0; i <= N; i++) { t = i / N; var s = t * shaft, b = A.bow(t) * k;
      C.push([x0 + ux * s + px * b, y0 + uy * s + py * b]); }
    var Lp = [], Rp = [];
    for (i = 0; i <= N; i++) {
      t = i / N;
      var a = C[Math.max(0, i - 1)], c = C[Math.min(N, i + 1)];
      var tx = c[0] - a[0], ty = c[1] - a[1], tl = Math.hypot(tx, ty) || 1;
      var nx = -ty / tl, ny = tx / tl, w = A.w(t) * k / 2;
      Lp.push([C[i][0] + nx * (w + A.trL(t) * k), C[i][1] + ny * (w + A.trL(t) * k)]);
      Rp.push([C[i][0] - nx * (w + A.trR(t) * k), C[i][1] - ny * (w + A.trR(t) * k)]);
    }
    var d = 'M ' + Lp[0][0].toFixed(1) + ' ' + Lp[0][1].toFixed(1);
    for (i = 1; i <= N; i++) d += ' L ' + Lp[i][0].toFixed(1) + ' ' + Lp[i][1].toFixed(1);
    for (i = N; i >= 0; i--) d += ' L ' + Rp[i][0].toFixed(1) + ' ' + Rp[i][1].toFixed(1);
    d += ' Z';
    var e = C[N], e0 = C[N - 2];
    var hx = e[0] - e0[0], hy = e[1] - e0[1], hl = Math.hypot(hx, hy) || 1;
    var tx2 = hx / hl, ty2 = hy / hl, nx2 = -ty2, ny2 = tx2;
    var b1 = [e[0] + nx2 * HW / 2 + tx2 * H.skew * 6 * k, e[1] + ny2 * HW / 2 + ty2 * H.skew * 6 * k];
    var b2 = [e[0] - nx2 * HW / 2, e[1] - ny2 * HW / 2];
    var notch = [e[0] - tx2 * HLEN * H.back, e[1] - ty2 * HLEN * H.back];
    var hd = 'M ' + b1[0].toFixed(1) + ' ' + b1[1].toFixed(1) +
      ' Q ' + (b1[0] + (x1 - b1[0]) * .55 + nx2 * 1.6 * k).toFixed(1) + ' ' + (b1[1] + (y1 - b1[1]) * .55 + ny2 * 1.6 * k).toFixed(1) +
      ' ' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
      ' Q ' + (b2[0] + (x1 - b2[0]) * .55 - nx2 * 1.2 * k).toFixed(1) + ' ' + (b2[1] + (y1 - b2[1]) * .55 - ny2 * 1.2 * k).toFixed(1) +
      ' ' + b2[0].toFixed(1) + ' ' + b2[1].toFixed(1) +
      ' Q ' + notch[0].toFixed(1) + ' ' + notch[1].toFixed(1) + ' ' + b1[0].toFixed(1) + ' ' + b1[1].toFixed(1) + ' Z';
    return '<path d="' + d + '"></path><path d="' + hd + '"></path>';
  }
  function drawLink() {
    var svg = document.getElementById('link'), note = document.getElementById('note');
    if (!svg || !note) return;
    var pr = document.getElementById('print').getBoundingClientRect();
    var n = note.getBoundingClientRect();
    var cb = document.getElementById('printcard').getBoundingClientRect();
    var g = card.grid, r = W.on && W.row >= 0 ? W.row : rowOf(S.frame);
    svg.setAttribute('viewBox', '0 0 ' + pr.width + ' ' + pr.height);
    svg.setAttribute('preserveAspectRatio', 'none');
    /* the point stops at the card's edge, on the middle of the row the frame is in */
    var rowMid = (g.rows[r] + g.rows[r + 1]) / 200;
    var gap0 = cb.left - n.right;                      /* the gutter we have to draw in */
    var k = Math.max(.55, Math.min(1, gap0 / 78));
    /* the point stops clear of the card: the head's own bulge is counted in */
    var x1 = cb.left - pr.left - (5 + 5 * k), y1 = cb.top - pr.top + cb.height * rowMid;
    var gutter = x1 - (n.right - pr.left);
    var rise = gutter > 55 ? 64 : 34;
    var kind = r === 0 ? 'climb' : r === 1 ? 'level' : 'fall';
    var x0 = n.right - pr.left + 2;
    var y0 = y1 + (r === 0 ? rise : r === 2 ? -rise : 0);
    svg.innerHTML = arrowPath(kind, x0, y0, x1, y1, k);
    if (!reduce) svg.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' });
  }

  var live = document.getElementById('live');

  /* ---------------- the walk: three stops, one per row ----------------
     Timing from evidence, see docs/design/AUTOPLAY-WALK.md: about 41 words per stop at the rate
     NN/g recommends for content the reader cannot pace (1 second per 3 words), plus 1.5s to take
     in the three frames. English 15s a row, Slovak 17s (Slovak runs longer per word), and a 0.8s
     beat where the row changes. Never starts on its own; one press stops it. */
  var W = { on: false, row: -1, timer: null, endAt: 0, left: 0, pauses: {} };
  var DUR = S.lang === 'sk' ? 17000 : 15000, BEAT = 800;
  var walkBtn;

  /* the walk moves the highlight with a transform, so travelling between rows costs no layout shift */
  function slideRing(node, rows, r) {
    if (r === 0) { node.style.transform = ''; return; }
    var h0 = rows[1] - rows[0], hr = rows[r + 1] - rows[r], dy = rows[r] - rows[0];
    node.style.transformOrigin = 'top';
    node.style.transform = 'translateY(' + (dy / h0 * 100).toFixed(2) + '%) scaleY(' + (hr / h0).toFixed(4) + ')';
  }
  function paintRow(r) {
    var ring = document.getElementById('ring'), pring = document.getElementById('pring');
    if (r === 0) {
      ring.setAttribute('style', ringRow(card, 0));
      pring.setAttribute('style', pathRingRow(0));
    }
    slideRing(ring, card.grid.rows, r);
    slideRing(pring, PATH.rows, r);
    document.getElementById('noteslot').innerHTML = rowNoteHTML(r);
    document.getElementById('dots').innerHTML = [0,1,2].map(function (rr) {
      return '<span class="g">' + [0,1,2].map(function () {
        return '<span class="dot ' + (rr === r ? 'on' : (rr < r ? 'done' : '')) + '"></span>'; }).join('') + '</span>';
    }).join('');
    drawLink();
    live.textContent = T.rows[r] + '. ' + T.why[r];
  }
  function schedule(ms) { W.endAt = Date.now() + ms; W.timer = setTimeout(walkNext, ms); }
  function walkNext() {
    W.row++;
    if (W.row > 2) return walkEnd(true);
    paintRow(W.row);
    schedule(DUR + (W.row < 2 ? BEAT : 0));
  }
  function walkStart() {
    W.on = true; W.row = -1; W.pauses = {};
    walkBtn.textContent = T.stop; walkBtn.setAttribute('aria-pressed', 'true');
    walkNext();
  }
  function walkEnd(finished) {
    if (!W.on) return;
    clearTimeout(W.timer);
    W.on = false; W.row = -1; W.pauses = {};
    walkBtn.textContent = T.walk; walkBtn.setAttribute('aria-pressed', 'false');
    /* it ends on the last row, where it left you — nothing jumps. Stopping it by hand puts the
       single frame back, and that move is yours, so it costs nothing either. */
    if (!finished) setFrame(S.frame);
  }
  function walkPause(why) {
    if (!W.on) return;
    var was = Object.keys(W.pauses).length;
    W.pauses[why] = 1;
    if (!was) { clearTimeout(W.timer); W.left = Math.max(400, W.endAt - Date.now()); }
  }
  function walkResume(why) {
    if (!W.on || !W.pauses[why]) return;
    delete W.pauses[why];
    if (!Object.keys(W.pauses).length) schedule(W.left);
  }

  function setFrame(i) {
    S.frame = (i + 9) % 9;
    var ring = document.getElementById('ring'), pring = document.getElementById('pring');
    ring.style.transform = ''; pring.style.transform = '';
    ring.setAttribute('style', frameRing(card, S.frame));
    pring.setAttribute('style', pathRing(S.frame));
    document.getElementById('noteslot').innerHTML = noteHTML();
    document.getElementById('dots').innerHTML = dotsHTML();
    drawLink();
    var p = new URLSearchParams(location.search); p.set('frame', S.frame);
    history.replaceState(null, '', '?' + p);
    live.textContent = T.rows[rowOf(S.frame)] + ' · ' + card.captions[S.frame];
  }
  walkBtn = document.getElementById('walk');
  walkBtn.addEventListener('click', function () { W.on ? walkEnd(false) : walkStart(); });
  document.addEventListener('click', function (e) {
    if (e.target.closest('#walk')) return;
    var f = e.target.closest('[data-frame]');
    if (f) { walkEnd(false); return setFrame(+f.dataset.frame); }
    var s = e.target.closest('[data-step]');
    if (s) { walkEnd(false); return setFrame(S.frame + (+s.dataset.step)); }
    var c = e.target.closest('[data-card]');
    if (c) { var p = new URLSearchParams(location.search); p.set('card', c.dataset.card); p.set('frame', 0); location.search = p; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); walkEnd(false); setFrame(S.frame + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); walkEnd(false); setFrame(S.frame - 1); }
    if (e.key === 'Escape') walkEnd(false);
  });
  /* a keyboard user is never left fighting the timer */
  document.addEventListener('focusin', function (e) {
    if (W.on && !e.target.closest('#walk') && document.getElementById('print').contains(e.target)) walkEnd(false);
  });
  /* scrolled away: hold. back in view: carry on from where it was, never from the start */
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) {
      es.forEach(function (en) { en.intersectionRatio < .5 ? walkPause('view') : walkResume('view'); });
    }, { threshold: [0, .5, 1] }).observe(document.getElementById('print'));
  }
  document.addEventListener('visibilitychange', function () {
    document.hidden ? walkPause('tab') : walkResume('tab');
  });
  drawLink();
  window.addEventListener('resize', drawLink);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawLink);
  document.querySelectorAll('.path img, .print__card img').forEach(function (im) { if (!im.complete) im.addEventListener('load', drawLink); });

  function dealInto(box, n) {
    var pool = CARDS.slice(), out = [];
    while (out.length < n) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    box.innerHTML = out.map(function (c) { return '<span class="slot"><img src="' + src(c) + '" alt="' + c.name + '" width="800" height="1314"></span>'; }).join('');
    live.textContent = out.map(function (c) { return c.name; }).join(', ');
  }
  var d1 = document.getElementById('draw1'), d3 = document.getElementById('draw3');
  d1.addEventListener('click', function () { dealInto(document.getElementById('deal1'), 1); this.textContent = T.again; });
  d3.addEventListener('click', function () { dealInto(document.getElementById('deal3'), 3); this.textContent = T.again; });
  if (S.state === 'dealt') { dealInto(document.getElementById('deal1'), 1); dealInto(document.getElementById('deal3'), 3); }

  function link(k, v, label) { var p = new URLSearchParams(location.search); p.set(k, v); return '<a href="?' + p + '" aria-current="' + (String(S[k]) === String(v)) + '">' + (label || v) + '</a>'; }
  document.getElementById('board').innerHTML =
    '<span class="grp"><b>Frame</b>' + [0,1,2,3,4,5,6,7,8].map(function (i) { return link('frame', i, 'f' + (i+1)); }).join('') + '</span>' +
    '<span class="grp"><b>Card</b>' + [0,2,3].map(function (i) { return link('card', i, CARDS[i].name.split(' ')[0]); }).join('') + '</span>' +
    '<span class="grp"><b>Lang</b>' + link('lang','en','EN') + link('lang','sk','SK') + '</span>' +
    '<span class="grp"><b>Readings</b>' + link('state','','empty') + link('state','dealt','dealt') + '</span>';
})();
</script>
</body>
</html>
