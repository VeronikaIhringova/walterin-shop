<title>S2 · The annotated print with the nine-frame path</title>
<!--
  Mock-up only. The annotated print, with:
    · a drawn ink arrow — one confident tapered stroke with a proper head, always from the left
    · the arrow's direction says the row: it rises for the top row, runs level for the middle, falls for the bottom
    · the printed nine-frame path diagram as a map: the matching cell lights up as you step
  Two arrangements: ?arr=a (note · card · map) and ?arr=b (note · card, map underneath).
  URL: ?arr=a|b · lang=en|sk · card=0..9 · frame=0..8 · state=dealt · board=0
  Diagram: assets/nine-frame-path-grid.png|webp, cropped from
  assets/Comic_Tarot_of_Consciousness_Official_Cards.pdf. Cell geometry is measured, see CELLS below.
-->

<style>
@font-face { font-family: 'WalterinBold'; src: url('https://cdn.shopify.com/s/files/1/0897/8864/5705/files/WalterinBold.woff2?v=1725196093') format('woff2'); font-display: swap; }
:root {
  --paper: #FFFDF7; --ink: #222222; --yellow: #FCF205;
  --row1: #69E7FD; --row2: #FFFE03; --row3: #75FEF4;   /* sampled from the card artwork */
  --line: 2.5px; --thin: 1.5px; --radius: 8px;
  --display: 'WalterinBold', 'Chalkboard SE', sans-serif;
  --body: 'Inter', system-ui, sans-serif;
  --fs-heading: 30px; --fs-label: 18px; --fs-body: 15px; --fs-small: 13.5px;
  --frame-pad: 15px; --ease: cubic-bezier(.2,.75,.2,1);
}
@media (min-width: 750px) { :root { --fs-heading: 38px; --fs-label: 21px; --fs-body: 16px; --fs-small: 14px; --frame-pad: 50px; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: var(--fs-body); line-height: 1.5; overflow-wrap: normal; word-break: normal; hyphens: none; -webkit-font-smoothing: antialiased; }
p, h1, h2, h3, figure, figcaption { margin: 0; padding: 0; }
img { display: block; max-width: 100%; height: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.sr { position: absolute !important; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.board { font: 13px/1.4 var(--body); background: #fff; border-bottom: 1px dashed #999; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.board a { color: inherit; padding: 2px 6px; border: 1px solid #bbb; border-radius: 4px; text-decoration: none; }
.board a[aria-current='true'] { background: var(--yellow); border-color: var(--ink); }
.board .grp { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
body.noboard .board { display: none; }

.wrap { width: 92%; max-width: 1400px; margin-inline: auto; padding-inline: var(--frame-pad); }
.sec { padding-block: 30px; }
@media (min-width: 990px) { .sec { padding-block: 42px; } }
.title { font-family: var(--display); font-size: var(--fs-heading); line-height: 1.05; letter-spacing: .01em; text-transform: uppercase; }
.small { font-size: var(--fs-small); line-height: 1.4; }
.lead { font-size: var(--fs-body); line-height: 1.45; max-width: 58ch; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 6px 16px;
  font-family: var(--display); font-size: var(--fs-body); line-height: 1; letter-spacing: .03em; text-transform: uppercase;
  background: var(--yellow); border: var(--line) solid var(--ink); border-radius: var(--radius); box-shadow: 3px 3px 0 var(--ink);
  transition: transform .12s var(--ease), box-shadow .12s var(--ease); margin: 0 3px 3px 0; }
.btn:hover { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.btn--ghost { background: var(--paper); }

.s2head { display: grid; grid-template-columns: minmax(0,1fr); gap: 10px; margin-bottom: 20px; }
.s2head__text { display: grid; gap: 8px; max-width: 62ch; }
.pickerline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; max-width: 100%; }
.pickerline .picker { flex: 1 1 auto; min-width: 0; }
.steps .pickerline { flex: 1 1 100%; min-width: 0; }
.picker { display: flex; gap: 7px; max-width: 100%; overflow-x: auto; padding: 2px 0; }
.picker button { position: relative; flex: none; width: 38px; aspect-ratio: 800/1314; border: var(--thin) solid var(--ink); border-radius: 4px; overflow: hidden; background: var(--paper); }
.picker button img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.picker button[aria-pressed='true'] { outline: 3px solid var(--yellow); outline-offset: -3px; }
.picker button::after { content: attr(data-name); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%);
  white-space: nowrap; font-size: 12px; background: var(--paper); border: var(--thin) solid var(--ink); border-radius: 4px; padding: 2px 6px;
  opacity: 0; pointer-events: none; transition: opacity .12s var(--ease); z-index: 6; }
.picker button:hover::after, .picker button:focus-visible::after { opacity: 1; }
.now { font-family: var(--display); font-size: var(--fs-label); text-transform: uppercase; letter-spacing: .02em; }

/* the card, the frames, the dimming */
.cardbox { position: relative; border-radius: var(--radius); overflow: hidden; box-shadow: 3px 3px 0 rgb(34 34 34 / .28); }
.cardbox img { width: 100%; border: var(--line) solid var(--ink); border-radius: var(--radius); background: var(--paper); }
.ring { position: absolute; border: 3px solid var(--ink); border-radius: 3px; pointer-events: none;
  transition: left .22s var(--ease), top .22s var(--ease), width .22s var(--ease), height .22s var(--ease);
  box-shadow: 0 0 0 9999px rgb(255 253 247 / .58); }
.hot { position: absolute; border: 0; background: transparent; cursor: pointer; }
.hot::after { content: attr(data-n); position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border: var(--thin) solid var(--ink);
  border-radius: 50%; background: var(--paper); font: 700 9px/14px var(--body); text-align: center; opacity: .9; }
.crop { background-repeat: no-repeat; border: var(--line) solid var(--ink); border-radius: 6px; background-color: var(--paper); }

/* the note — always on the left, so the arrow travels the way the eye already moves */
.print { position: relative; display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; }
.note { position: relative; border: var(--line) solid var(--ink); border-radius: var(--radius); background: var(--paper);
  box-shadow: 3px 3px 0 rgb(34 34 34 / .28); display: grid; gap: 9px; padding: 0 0 13px; width: 100%;
  align-content: start; min-height: 500px; }   /* the tallest case, so nothing moves between frames */
@media (min-width: 990px) { .note { min-height: 426px; } }
.note__band { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 7px 13px;
  border-bottom: var(--thin) solid var(--ink); border-radius: 5px 5px 0 0; background: var(--rowc); }
.note__row { font-family: var(--display); font-size: 15px; letter-spacing: .03em; text-transform: uppercase; }
.note__n { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
.note__body { display: grid; gap: 9px; padding: 0 13px; justify-items: start; }
.note .crop { width: 150px; box-shadow: 0 0 0 4px var(--rowc); }
.note__cap { font-family: var(--display); font-size: var(--fs-label); line-height: 1.12; text-transform: uppercase; letter-spacing: .02em; }
.link { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; overflow: visible; }
.link .shaft, .link .head { fill: var(--ink); stroke: none; }

/* the printed diagram, used as a map */
.map { display: grid; gap: 8px; justify-items: start; }
.map__frame { position: relative; width: 100%; border: var(--line) solid var(--ink); border-radius: var(--radius);
  overflow: hidden; background: #fff; box-shadow: 3px 3px 0 rgb(34 34 34 / .28); }
.map__frame img { width: 100%; }
.mcell { position: absolute; border: 3px solid var(--ink); border-radius: 2px; pointer-events: none;
  transition: left .22s var(--ease), top .22s var(--ease), width .22s var(--ease), height .22s var(--ease);
  box-shadow: 0 0 0 9999px rgb(255 253 247 / .58); }
.map__cap { font-size: var(--fs-small); line-height: 1.35; }

.steps { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.dots { display: flex; gap: 9px; }
.dots .g { display: flex; gap: 3px; padding: 3px 5px; border-radius: 999px; background: var(--g); }
.dot { width: 9px; height: 9px; border: var(--thin) solid var(--ink); border-radius: 50%; }
.dot.on { background: var(--ink); }

/* ===== arrangement A · note · card · map, all on one line ===== */
@media (min-width: 990px) {
  body.arr-a .print__row { display: grid; grid-template-columns: 322px 250px 292px; justify-content: center; align-items: center; gap: 0 26px; }
  body.arr-a .map { align-self: center; }
}
/* ===== arrangement B · note and card on top, the map underneath ===== */
@media (min-width: 990px) {
  body.arr-b .print__row { display: grid; grid-template-columns: 348px 262px; justify-content: center; align-items: center; gap: 0 34px; }
  body.arr-b .map { margin-top: 26px; justify-items: center; justify-self: center; width: 302px; }
  body.arr-b .map__cap { text-align: center; }
}
/* phone: card and note side by side, the map under them */
@media (max-width: 989px) {
  /* the note keeps its side at every width, so the arrow always travels the same way */
  .print__row { display: grid; grid-template-columns: minmax(0,1fr) 150px; gap: 12px; align-items: start; }
  #noteslot { grid-column: 1; grid-row: 1; min-width: 0; }
  .print__card { grid-column: 2; grid-row: 1; width: 150px; }
  .map { grid-column: 1 / -1; grid-row: 2; }
  .note .crop { width: 100%; max-width: 128px; }
  .map { margin-top: 18px; }
  body.arr-a .map { width: 232px; justify-self: center; justify-items: center; }
  body.arr-a .map__cap { text-align: center; }
  body.arr-b .map { width: 100%; }
  .steps { justify-content: flex-start; }
}

.readings { margin-top: 44px; padding-top: 24px; border-top: var(--line) solid var(--ink); }
.readings__grid { display: grid; gap: 22px; margin-top: 18px; }
@media (min-width: 750px) { .readings__grid { grid-template-columns: 1fr 1fr; gap: 32px; } }
.reading { display: grid; gap: 10px; align-content: start; }
.reading h3 { font-family: var(--display); font-size: var(--fs-label); text-transform: uppercase; letter-spacing: .03em; }
.deal { display: flex; gap: 10px; }
.deal .slot { width: 76px; aspect-ratio: 800/1314; border: var(--thin) solid var(--ink); border-radius: 6px; overflow: hidden; background:
  repeating-linear-gradient(45deg, var(--yellow) 0 6px, var(--paper) 6px 12px); }
.deal .slot img { width: 100%; height: 100%; object-fit: cover; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var S = { arr: (q.get('arr') || 'a').toLowerCase(), lang: q.get('lang') || 'en', card: +(q.get('card') || 0), frame: +(q.get('frame') || 0), state: q.get('state') || '' };
  if (q.get('board') === '0') document.body.classList.add('noboard');
  document.body.classList.add('arr-' + S.arr);
  document.documentElement.lang = S.lang;
  var CARDS = JSON.parse(document.getElementById('carddata').textContent).cards;
  var ASSET = '../../../assets/';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ROWC = ['var(--row1)', 'var(--row2)', 'var(--row3)'];
  /* measured off the printed diagram, as percentages of the cropped grid */
  var CELLS = { cols: [0.53, 32.65, 65.56, 99.47], rows: [0, 34.54, 67.85, 100] };

  var T = {
    en: {
      h: 'How a card is read',
      intro: 'Every card is a nine-frame comic. Read it in three rows: the top row is what to understand, the middle what to accept, the bottom what to transform.',
      rows: ['What to understand', 'What to accept', 'What to transform'],
      why: [
        'What is going on. The top row names the situation: what is in front of you, and what to notice in it.',
        'What is yours. The middle row is what to come to terms with, or admit, before anything moves.',
        'What to do with it. The bottom row says where it leads and what can change.'
      ],
      hint: 'Step through the nine frames, or click one on the card.',
      pick: 'Try another card', back: 'Back', next: 'Next', frameOf: 'Frame [n] of 9',
      mapH: 'The nine-frame path',
      mapCap: 'The same nine steps, printed in the box. The lit cell is where this frame sits.',
      rH: 'The two readings in the box',
      rIntro: 'You can lay the cards out any way you know. Two readings come with this deck.',
      r1: 'Card of the day', r1t: 'Draw one card in the morning. Keep it where you will see it, and come back to it in the evening.',
      r2: 'Reading of consciousness', r2t: 'Three cards in three steps: what to understand, what to accept, what to transform. The same three steps as inside a single card.',
      draw1: 'Draw a card', draw3: 'Lay three', again: 'Draw again'
    },
    sk: {

      intro: 'Každá karta je deväťobrázkový komiks. Číta sa v troch riadkoch: hore to, čo máte pochopiť, v strede to, čo prijať, dole to, čo premeniť.',
      rows: ['Čo pochopiť', 'Čo prijať', 'Čo premeniť'],
      why: [
        'Čo sa deje. Horný riadok pomenuje situáciu: čo máte pred sebou a čoho si v nej treba všimnúť.',
        'Čo je vaše. Stredný riadok je to, s čím sa treba zmieriť alebo si to priznať, aby sa dalo pohnúť.',
        'Čo s tým. Spodný riadok hovorí, kam to vedie a čo sa dá zmeniť.'
      ],
      hint: 'Prechádzajte deviatimi obrázkami alebo kliknite na niektorý v karte.',
      pick: 'Skúsiť inú kartu', back: 'Späť', next: 'Ďalej', frameOf: 'Obrázok [n] z 9',
      mapH: 'Cesta v deviatich krokoch',
      mapCap: 'Tých istých deväť krokov nájdete vytlačených v balíčku. Zvýraznené políčko je miesto tohto obrázka.',
      rH: 'Dve čítania, ktoré sú v balíčku',
      rIntro: 'Karty môžete vykladať akokoľvek to poznáte. Dve čítania sú priamo v tomto balíčku.',

  function src(c) { return ASSET + c.file; }
  function el(h) { var d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; }
  function rowOf(i) { return Math.floor(i / 3); }

  function cropStyle(c, i) {

      '<span class="mcell" id="mcell" style="' + cellRing(S.frame) + '"></span></div>' +
      '<figcaption class="map__cap">' + T.mapCap + '</figcaption></figure>';
  }
  function noteHTML() {
    var r = rowOf(S.frame);
    return '<div class="note" id="note" style="--rowc:' + ROWC[r] + '">' +
      '<span class="note__band"><span class="note__row">' + T.rows[r] + '</span><span class="note__n">' + T.frameOf.replace('[n]', S.frame + 1) + '</span></span>' +
      '<span class="note__body"><span class="crop" style="' + cropStyle(card, S.frame) + '"></span>' +
      '<span class="note__cap">' + card.captions[S.frame] + '</span>' +
      '<span class="small">' + T.why[r] + '</span></span></div>';
  }
  function dotsHTML() {
    return [0,1,2].map(function (rr) {
      return '<span class="g" style="--g:' + ROWC[rr] + '">' + [0,1,2].map(function (cc) {
        var i = rr*3+cc; return '<span class="dot ' + (i === S.frame ? 'on' : '') + '"></span>'; }).join('') + '</span>';
    }).join('');
  }
  function pickerHTML() {
    return '<div class="pickerline"><span class="small">' + T.pick + '</span><div class="picker">' +
      CARDS.map(function (c, i) { return '<button type="button" data-card="' + i + '" data-name="' + c.name + '" aria-pressed="' + (i === S.card) + '" aria-label="' + c.name + '"><img src="' + src(c) + '" alt="" width="800" height="1314"></button>'; }).join('') +
      '</div><span class="now">' + card.name + '</span></div>';
  }
  function printHTML() {
    var row = '<div class="print__row">' +
      '<span id="noteslot">' + noteHTML() + '</span>' +
      '<div class="print__card" id="printcard">' + cardBox(card, S.frame) + '</div>' +
      (S.arr === 'a' ? mapHTML() : '') + '</div>' +
      (S.arr === 'b' ? mapHTML() : '');
    return '<div class="print" id="print">' + row +
      '<svg class="link" id="link" aria-hidden="true"></svg>' +
      '<div class="steps"><button class="btn btn--ghost" type="button" data-step="-1">' + T.back + '</button>' +
      '<span class="dots" id="dots">' + dotsHTML() + '</span>' +
      '<button class="btn btn--ghost" type="button" data-step="1">' + T.next + '</button>' +
      '<span style="width:18px"></span>' + pickerHTML() + '</div></div>';
  }
  function head() {
    return '<div class="s2head"><div class="s2head__text"><h2 class="title">' + T.h + '</h2>' +
      '<p class="lead">' + T.intro + '</p><p class="small">' + T.hint + '</p></div></div>';
  }
  function readings() {
    return '<section class="readings"><h2 class="title">' + T.rH + '</h2><p class="lead" style="margin-top:10px">' + T.rIntro + '</p>' +
      '<div class="readings__grid">' +
      '<div class="reading"><h3>' + T.r1 + '</h3><p class="small">' + T.r1t + '</p>' +
        '<div class="deal" id="deal1"><span class="slot"></span></div>' +
        '<div><button class="btn" type="button" id="draw1">' + T.draw1 + '</button></div></div>' +
      '<div class="reading"><h3>' + T.r2 + '</h3><p class="small">' + T.r2t + '</p>' +
        '<div class="deal" id="deal3"><span class="slot"></span><span class="slot"></span><span class="slot"></span></div>' +
        '<div><button class="btn" type="button" id="draw3">' + T.draw3 + '</button></div></div>' +
      '</div></section>';
  }
  document.getElementById('main').appendChild(el('<section class="sec"><div class="wrap">' + head() + printHTML() + readings() + '</div></section>'));

  /* ---------------- the ink arrow ----------------
     one tapered stroke drawn as a filled shape, with a real head.
     the row decides the gesture: it rises for the top row, runs level for the middle, falls for the bottom. */
  function bez(p0, c, p1, t) {
    var mt = 1 - t;
    return { x: mt*mt*p0.x + 2*mt*t*c.x + t*t*p1.x, y: mt*mt*p0.y + 2*mt*t*c.y + t*t*p1.y,
             dx: 2*mt*(c.x-p0.x) + 2*t*(p1.x-c.x), dy: 2*mt*(c.y-p0.y) + 2*t*(p1.y-c.y) };
  }
  function inkArrow(p0, c, p1, w0, w1) {
    /* sample the curve, then cut the shaft back by the head's length so the tip lands where it should */
    var N = 60, pts = [], cum = [0], i, s, len;
    for (i = 0; i <= N; i++) pts.push(bez(p0, c, p1, i / N));
    for (i = 1; i <= N; i++) cum.push(cum[i-1] + Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y));
    var HL = 20, HW = 19, total = cum[N], target = Math.max(total * .35, total - HL), tCut = 1;
    for (i = 1; i <= N; i++) if (cum[i] >= target) { var f = (target - cum[i-1]) / (cum[i] - cum[i-1] || 1); tCut = (i - 1 + f) / N; break; }

    var M = 30, L = [], R = [], nx, ny, w;
    for (i = 0; i <= M; i++) {
      var u = i / M, t = u * tCut; s = bez(p0, c, p1, t);
      len = Math.hypot(s.dx, s.dy) || 1; nx = -s.dy / len; ny = s.dx / len;
      w = (w0 + (w1 - w0) * Math.pow(u, .7)) * (1 + .07 * Math.sin(u * 7.3 + 1.1));   /* a hand never keeps one weight */
      L.push([s.x + nx * w / 2, s.y + ny * w / 2]);
      R.push([s.x - nx * w / 2, s.y - ny * w / 2]);
    }
    var d = 'M ' + L[0][0].toFixed(1) + ' ' + L[0][1].toFixed(1);
    for (i = 1; i <= M; i++) d += ' L ' + L[i][0].toFixed(1) + ' ' + L[i][1].toFixed(1);
    for (i = M; i >= 0; i--) d += ' L ' + R[i][0].toFixed(1) + ' ' + R[i][1].toFixed(1);
    d += ' Z';

    /* the head: base where the shaft stops, tip on the frame */
    var b = bez(p0, c, p1, tCut); len = Math.hypot(b.dx, b.dy) || 1;
    var tx = b.dx / len, ty = b.dy / len; nx = -ty; ny = tx;
    var tip = [p1.x, p1.y];
    var b1 = [b.x + nx * HW / 2, b.y + ny * HW / 2];
    var b2 = [b.x - nx * HW / 2, b.y - ny * HW / 2];
    var notch = [b.x - tx * HL * .28, b.y - ty * HL * .28];   /* a concave back edge, the way a pen leaves it */
    var hd = 'M ' + b1[0].toFixed(1) + ' ' + b1[1].toFixed(1) +
      ' L ' + tip[0].toFixed(1) + ' ' + tip[1].toFixed(1) +
      ' L ' + b2[0].toFixed(1) + ' ' + b2[1].toFixed(1) +
      ' Q ' + notch[0].toFixed(1) + ' ' + notch[1].toFixed(1) + ' ' + b1[0].toFixed(1) + ' ' + b1[1].toFixed(1) + ' Z';
    return '<path class="shaft" d="' + d + '"></path><path class="head" d="' + hd + '"></path>';
  }
  function drawLink() {
    var svg = document.getElementById('link'), note = document.getElementById('note');
    if (!svg || !note) return;
    var pr = document.getElementById('print').getBoundingClientRect();
    var n = note.getBoundingClientRect();
    var hot = document.querySelector('.hot[data-frame="' + S.frame + '"]').getBoundingClientRect();
    var r = rowOf(S.frame);
    svg.setAttribute('viewBox', '0 0 ' + pr.width + ' ' + pr.height);
    svg.setAttribute('preserveAspectRatio', 'none');

    /* it leaves the note low for the top row and high for the bottom one, so the gesture is unmistakable */
    var startAt = [.66, .5, .34][r];
    var p0 = { x: n.right - pr.left - 4, y: n.top - pr.top + n.height * startAt };
    var p1 = { x: hot.left - pr.left - 5, y: hot.top - pr.top + hot.height / 2 };
    var dx = p1.x - p0.x, dy = p1.y - p0.y;
    /* the control point keeps the curve flat at the start and lets it turn at the end */
    var c = r === 1
      ? { x: p0.x + dx * .5, y: p0.y + dy * .5 - 9 }
      : { x: p0.x + dx * .58, y: p0.y + dy * .16 };
    svg.innerHTML = inkArrow(p0, c, p1, 3, 7.5);
    if (!reduce) {
      var paths = svg.querySelectorAll('path');
      paths[0].animate([{ opacity: 0, transform: 'translateX(-8px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'cubic-bezier(.25,.46,.45,.94)' });
      paths[1].animate([{ opacity: 0 }, { opacity: 0 }, { opacity: 1 }], { duration: 300, easing: 'ease-out' });
    }
  }

  /* ---------------- stepping, in place ---------------- */
  var live = document.getElementById('live');
  function setFrame(i) {
    S.frame = (i + 9) % 9;
    var r = rowOf(S.frame);
    document.getElementById('ring').setAttribute('style', frameRing(card, S.frame));
    document.getElementById('mcell').setAttribute('style', cellRing(S.frame));
    document.getElementById('noteslot').innerHTML = noteHTML();
    document.getElementById('dots').innerHTML = dotsHTML();
    drawLink();
    var p = new URLSearchParams(location.search); p.set('frame', S.frame);
    history.replaceState(null, '', '?' + p);
    live.textContent = T.rows[r] + ' · ' + card.captions[S.frame];
  }
  document.addEventListener('click', function (e) {
    var f = e.target.closest('[data-frame]');
    if (f) return setFrame(+f.dataset.frame);
    var s = e.target.closest('[data-step]');
    if (s) return setFrame(S.frame + (+s.dataset.step));
    var c = e.target.closest('[data-card]');
    if (c) { var p = new URLSearchParams(location.search); p.set('card', c.dataset.card); p.set('frame', 0); location.search = p; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); setFrame(S.frame + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); setFrame(S.frame - 1); }
  });
  drawLink();
  window.addEventListener('resize', drawLink);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawLink);
  var mapImg = document.querySelector('.map__frame img');
  if (mapImg && !mapImg.complete) mapImg.addEventListener('load', drawLink);

  function dealInto(box, n) {
    var pool = CARDS.slice(), out = [];
    while (out.length < n) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    box.innerHTML = out.map(function (c) { return '<span class="slot"><img src="' + src(c) + '" alt="' + c.name + '" width="800" height="1314"></span>'; }).join('');
    live.textContent = out.map(function (c) { return c.name; }).join(', ');
  }
  var d1 = document.getElementById('draw1'), d3 = document.getElementById('draw3');
  d1.addEventListener('click', function () { dealInto(document.getElementById('deal1'), 1); this.textContent = T.again; });
  d3.addEventListener('click', function () { dealInto(document.getElementById('deal3'), 3); this.textContent = T.again; });
  if (S.state === 'dealt') { dealInto(document.getElementById('deal1'), 1); dealInto(document.getElementById('deal3'), 3); }

  function link(k, v, label) { var p = new URLSearchParams(location.search); p.set(k, v); return '<a href="?' + p + '" aria-current="' + (String(S[k]) === String(v)) + '">' + (label || v) + '</a>'; }
  document.getElementById('board').innerHTML =
    '<span class="grp"><b>Arrangement</b>' + link('arr','a','A · map beside') + link('arr','b','B · map underneath') + '</span>' +
    '<span class="grp"><b>Frame</b>' + [0,1,4,5,7,8].map(function (i) { return link('frame', i, 'f' + (i+1)); }).join('') + '</span>' +
    '<span class="grp"><b>Card</b>' + [0,2,3].map(function (i) { return link('card', i, CARDS[i].name.split(' ')[0]); }).join('') + '</span>' +
    '<span class="grp"><b>Lang</b>' + link('lang','en','EN') + link('lang','sk','SK') + '</span>' +
    '<span class="grp"><b>Readings</b>' + link('state','','empty') + link('state','dealt','dealt') + '</span>';
})();
</script>
</body>
</html>
