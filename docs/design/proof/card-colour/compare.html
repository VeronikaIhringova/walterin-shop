<!doctype html><meta charset="utf-8">
<title>Card colour — three options</title>
<style>
 body{margin:0;padding:28px;background:#FFFDF7;color:#222;
      font:15px/1.5 Inter,system-ui,-apple-system,sans-serif}
 h1{font-family:"WalterinBold","Chalkboard SE","Comic Sans MS",sans-serif;
    font-weight:400;text-transform:uppercase;font-size:28px;margin:0 0 6px}
 p.lead{margin:0 0 22px;color:#222222a8;max-width:70ch}
 .row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start}
 figure{margin:0}
 figcaption{margin-bottom:8px}
 .name{font-family:"WalterinBold","Chalkboard SE",sans-serif;text-transform:uppercase;
       font-size:15px;letter-spacing:.03em}
 .meta{font-size:13px;color:#222222a8}
 .sw{display:inline-block;width:14px;height:14px;border:1.5px solid #222;
     border-radius:3px;vertical-align:-2px;margin-right:6px}
 img{width:100%;display:block;border:1.5px solid #222;border-radius:8px}
</style>
<h1>Card colour — three options</h1>
<p class="lead">The same Shop page, three card colours. Each fills the card bottom and the bar, so
the two are one material. Page background is #FFFDF7.</p>
<div class="row">
  <figure>
    <figcaption>
      <div class="name"><span class="sw" style="background:#FAF4E4"></span>A · Warm cream</div>
      <div class="meta">#FAF4E4 · ink 14.49:1 · separation from page 1.079:1</div>
    </figcaption>
    <img src="shop-cream.png" alt="">
  </figure>
  <figure>
    <figcaption>
      <div class="name"><span class="sw" style="background:#EFE4CE"></span>B · Sand / kraft</div>
      <div class="meta">#EFE4CE · ink 12.62:1 · separation from page 1.239:1</div>
    </figcaption>
    <img src="shop-sand.png" alt="">
  </figure>
  <figure>
    <figcaption>
      <div class="name"><span class="sw" style="background:#FBF3C4"></span>C · Pale brand yellow</div>
      <div class="meta">#FBF3C4 · ink 14.18:1 · separation from page 1.103:1</div>
    </figcaption>
    <img src="shop-sun.png" alt="">
  </figure>
</div>
